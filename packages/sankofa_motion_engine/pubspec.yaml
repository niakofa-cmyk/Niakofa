name: sankofa_motion_engine
description: >-
  Standalone Flutter package for the Sankofa Motion Engine (SME) —
  a pure-Dart kinematic solver that drives the SankofaBird SVG marker.
  Runs without Rive .riv files or Unity builds: all animation is computed
  in pure math (flight physics → motion solver → animation mixer).

version: 1.0.0
homepage: https://github.com/niakofa-cmyk/Niakofa
repository: https://github.com/niakofa-cmyk/Niakofa/tree/main/packages/sankofa_motion_engine

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
