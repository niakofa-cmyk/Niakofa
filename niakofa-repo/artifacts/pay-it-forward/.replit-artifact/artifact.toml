kind = "web"
previewPath = "/"
title = "Niakofa — Community Help Platform"
version = "1.0.0"
id = "artifacts/pay-it-forward"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18848

[services.development]
run = "pnpm --filter @workspace/pay-it-forward run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pay-it-forward", "run", "build" ]
publicDir = "artifacts/pay-it-forward/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18848"
BASE_PATH = "/"
