        longitude:
          type: ["number", "null"]
          description: Map pin longitude. Null if not yet geocoded.
        open_hours:
          type: ["string", "null"]
          description: JSON weekly schedule string keyed by day (sun..sat), e.g. {"mon":"09:00-17:00","sun":null}

