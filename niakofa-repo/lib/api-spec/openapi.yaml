        avatar_url:
          type: ["string", "null"]
        lat:
          type: number
        lng:
          type: number
        heading:
          type: ["number", "null"]
        trust_score:
          type: ["number", "null"]
        help_count:
          type: integer
        is_online:
          type: boolean
        active_request_id:
          type: ["integer", "null"]
        distance_miles:
          type: ["number", "null"]

    RouteData:
      type: object
      required: [geometry, distance_meters, duration_seconds, steps]
      properties:
        geometry:
          type: object
          description: GeoJSON LineString geometry
        distance_meters:
          type: number
        duration_seconds:
          type: number
        steps:
          type: array
          items:
            $ref: "#/components/schemas/RouteStep"
        eta_text:
          type: string
          description: Human-readable ETA, e.g. "12 min (moderate traffic)"
        distance_text:
          type: string
        initial_bearing:
          type: number
          description: Compass bearing (0-359) from start toward first waypoint
        speed_mph:
          type: number
        speed_kph:
          type: number
        waypoints:
          type: integer
        legs_count:
          type: integer
        bbox:
          type: array
          nullable: true
          items:
            type: number
          description: "[minLng, minLat, maxLng, maxLat] bounding box for camera fit"
        profile:
          type: string
          enum: [driving, walking, cycling]
        units:
          type: string
          enum: [imperial, metric]
        traffic_level:
          type: string
          enum: [low, moderate, heavy, severe, unknown]
          description: Dominant congestion level across the route (driving only)
        congestion_segments:
          type: integer
          description: Total number of annotated congestion segments

    Transaction:
      type: object
      required: [id, user_id, type, amount, created_at]
      properties:
        id:
          type: integer
        user_id:
          type: integer
        request_id:
          type: ["integer", "null"]
        type:
          type: string
          enum: [earned, pledge_received, pledge_sent, pledge_repayment, goodwill]
          description: earned=immediate pay, pledge_received=niakofa payment received, pledge_sent=contribution made, pledge_repayment=wallet-funded installment payment toward an existing pledge, goodwill=volunteer act
        amount:
          type: number
        description:
          type: ["string", "null"]
        created_at:
          type: string

    RouteStep:
      type: object
      required: [instruction, distance_meters, duration_seconds]
      properties:
        instruction:
          type: string
          description: Mapbox maneuver instruction text
        voice_announcement:
          type: string
          description: Closest-range voice announcement — richer phrasing than instruction, used for TTS
        distance_meters:
          type: number
        duration_seconds:
          type: number
        maneuver_type:
          type: ["string", "null"]
        maneuver_direction:
          type: ["string", "null"]


