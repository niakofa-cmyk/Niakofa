      responses:
        "200":
          description: Platform KPIs

  /admin/nia-memory-stats:
    get:
      operationId: getNiaMemoryStats
      tags: [admin]
      summary: Get Nia conversational memory stats (admin only)
      responses:
        "200":
          description: Memory stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: integer
                  entries:
                    type: integer

  /admin/accounts/{id}/approval:
    patch:
      operationId: setAccountApproval
      tags: [admin]
      summary: Approve, deny, or reset an account's approval status (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetAccountApprovalInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /admin/bootstrap:
    post:
      operationId: bootstrapAdmin
      tags: [admin]
      summary: One-time self-locking bootstrap — grant is_admin to the first account using ADMIN_BOOTSTRAP_SECRET (locks itself out after first successful use)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapAdminInput"
      responses:
        "200":
          description: Admin granted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  user_id:
                    type: integer
                  email:
                    type: string

  /admin/communities:
    get:
      operationId: listCommunities
      tags: [admin]
      summary: List all communities with unassigned-user bucket and default community (admin only)
      responses:
        "200":
          description: Communities
          content:
            application/json:
              schema:
                type: object
                properties:
                  communities:
                    type: array
                    items:
                      type: object
                  unassigned:
                    type: object
                  default_community_id:
                    type: integer
                    nullable: true
    post:
      operationId: createCommunity
      tags: [admin]
      summary: Create a new community (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommunityInput"
      responses:
        "200":
          description: Community created

  /admin/communities/{id}:
    patch:
      operationId: updateCommunity
      tags: [admin]
      summary: Update a community's settings (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCommunityInput"
      responses:
        "200":
          description: Community updated

  /admin/communities/{id}/set-default:
    patch:
      operationId: setDefaultCommunity
      tags: [admin]
      summary: Set the platform-wide default community for unassigned users (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Default community set
          content:
            application/json:
              schema:
                type: object
                properties:
                  default_community_id:
                    type: integer

  /griot/hubs/{id}/summary:
    get:
      operationId: getHubSummary
      tags: [griot]
      summary: Consolidated hub-leader dashboard payload — hub info, ring-fenced reserved balance, crisis status, open requests, approved leaders, recent inbound pledges, and whether the caller can manage the hub (auth required)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Hub summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  hub:
                    type: object
                  reserved_balance:
                    type: number
                  open_request_count:
                    type: integer
                  open_requests:
                    type: array
                    items:
                      type: object
                  leaders:
                    type: array
                    items:
                      type: object
                  recent_pledges:
                    type: array
                    items:
                      type: object
                  is_leader_or_admin:
                    type: boolean
        "404":
          description: Hub not found

  /admin/users/{id}/community:
    patch:
      operationId: reassignUserCommunity
      tags: [admin]
      summary: Reassign a user to a different community, or unassign (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReassignUserCommunityInput"
      responses:
        "200":
          description: User reassigned

components:
  schemas:
    PoolStats:
      type: object
      required: [enabled, guaranteed_minimum, balance, total_contributed, total_fronted, total_repaid, total_minimums, helpers_fronted, sponsor_count, pending_minimums_count, pending_minimums_total]
      properties:
        enabled:
          type: boolean
        guaranteed_minimum:
          type: number
        minimum_hourly_rate:
          type: number
          description: Per-hour livable-wage floor used to scale the guaranteed minimum by estimated task duration (global platform default — see GET /communities/{id} for a county-specific rate).
        balance:
          type: number
        total_contributed:
          type: number
        total_fronted:
          type: number
        total_repaid:
          type: number
        total_minimums:
          type: number
        helpers_fronted:
          type: integer
        sponsor_count:
          type: integer
        pending_minimums_count:
          type: integer
          description: Guaranteed minimums queued because the pool ran dry
        pending_minimums_total:
          type: number
          description: Total dollars owed to helpers awaiting pool backfill
        inflow_30d:
          type: number
          description: Total pool inflow (contributions + repayments) in the last 30 days
        outflow_30d:
          type: number
          description: Total pool outflow (fronts + guaranteed minimums) in the last 30 days
        runway_days:
          type: integer
          nullable: true
          description: Estimated days of runway left at the current 30-day burn rate. Null = no burn in the last 30 days (effectively infinite).
        outstanding_pif_total:
          type: number
          description: Total outstanding pay-it-forward pledges owed back to the pool
        helpers_earned_7d:
          type: number
          description: Total dollars paid out to helpers in the last 7 days
        helpers_paid_7d:
          type: integer
          description: Count of unique helpers paid in the last 7 days

    PoolLedgerEntry:
      type: object
      required: [id, entry_type, amount, created_at]
      properties:
        id:
          type: integer
        entry_type:
          type: string
          enum: [sponsor_contribution, helper_front, pledge_repayment, guaranteed_minimum, adjustment]
        amount:
          type: number
        request_id:
          type: integer
          nullable: true
        display_name:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    PoolLedgerResponse:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/PoolLedgerEntry"

    PoolContributeBody:
      type: object
      required: [amount]
      properties:
        amount:
          type: number
          minimum: 1
          maximum: 10000

    PoolContributeResponse:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [stripe, recorded]
        client_secret:
          type: string
          nullable: true
        payment_intent_id:
          type: string
          nullable: true
        balance:
          type: number
          nullable: true

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    User:
      type: object
      required: [id, name, email, is_helper, helper_mode_active, help_count, benevolence_wallet, goodwill_score]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        avatar_url:
          type: ["string", "null"]
        is_helper:
          type: boolean
        helper_mode_active:
          type: boolean
        lat:
          type: ["number", "null"]
        lng:
          type: ["number", "null"]
        trust_score:
          type: ["number", "null"]
        help_count:
          type: integer
        neighborhood:
          type: ["string", "null"]
        benevolence_wallet:
          type: number
          description: Accumulated helper earnings and contributions
        goodwill_score:
          type: integer
          description: Community reputation score
        no_show_count:
          type: integer
          description: Number of times helper released a claimed request (no-show tracking)
          default: 0
        is_admin:
          type: boolean
          description: RBAC admin flag — see requireAdmin() middleware
        created_at:
          type: string
        account_type:
          type: ["string", "null"]
          enum: [individual, organization, business, sponsor, null]
        city:
          type: ["string", "null"]
        specialties:
          type: ["array", "null"]
          items:
            type: string
        community_id:
          type: ["integer", "null"]
          description: The county/community pool this user is scoped to — resolves the livable-wage floor and pool-health multiplier for this user. Null = legacy global/unassigned bucket.
        helper_status:
          type: ["string", "null"]
          enum: [offline, pending, approved, denied, null]
          description: Helper application/approval state. "offline" is the default for accounts that have never applied. Only "approved" accounts can set helper_mode_active to true (PATCH /users/{id}/helper-mode enforces this server-side).

    UserUpdate:
      type: object
      properties:
        name:
          type: string
        avatar_url:
          type: string
        neighborhood:
          type: string
        is_helper:
          type: boolean
        city:
          type: string
        specialties:
          type: array
          items:
            type: string
        phone_masked:
          type: string
        quick_replies:
          type: array
          items:
            type: string

    ChangePasswordInput:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          description: The user's current password
        new_password:
          type: string
          minLength: 8
          description: The new password (min 8 chars, must differ from current)

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    RequestPasswordResetInput:
      type: object
      required: [email]
      properties:
        email:
          type: string

    SetInitialPasswordInput:
      type: object
      required: [user_id, email, code, new_password]
      properties:
        user_id:
          type: integer
        email:
          type: string
        code:
          type: string
        new_password:
          type: string
          minLength: 8

    UpdateUserAvatarInput:
      type: object
      required: [dataUrl]
      properties:
        dataUrl:
          type: string
          description: Base64-encoded image, must start with "data:image/". Max ~5 MB.

    UpdatePanicContactsInput:
      type: object
      required: [contacts]
      properties:
        contacts:
          type: array
          items:
            type: string
          maxItems: 5

    UpdateHelperAvailabilityInput:
      type: object
      required: [windows]
      properties:
        windows:
          type: array
          items:
            $ref: "#/components/schemas/AvailabilityWindowInput"

    CreatePaymentIntentInput:
      type: object
      required: [requestId, amount]
      properties:
        requestId:
          type: integer
        amount:
          type: number
        helperId:
          type: integer
        paymentType:
          type: string
          enum: [immediate, pay_it_forward]

    StartStripeConnectOnboardingInput:
      type: object
      required: [userId]
      properties:
        userId:
          type: integer

    StartIdentityVerificationInput:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: integer

    TriggerSosInput:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: integer
        lat:
          type: number
        lng:
          type: number
        message:
          type: string

    InitiateBackgroundCheckInput:
      type: object
      properties:
        dob:
          type: string
        zip_code:
          type: string

    AdminSetBackgroundCheckStatusInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [not_started, pending, passed, failed]

    VerifyAdminSecretInput:
      type: object
      properties:
        secret:
          type: string

    SuspendUserInput:
      type: object
      properties:
        reason:
          type: string

    ToggleNiaInput:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
        reason:
          type: string

    SetAccountApprovalInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [approved, denied, pending]

    BootstrapAdminInput:
      type: object
      required: [email, secret]
      properties:
        email:
          type: string
        secret:
          type: string

    CreateCommunityInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        target_reserve_amount:
          type: number

    UpdateCommunityInput:
      type: object
      properties:
        name:
          type: string
        target_reserve_amount:
          type: number
        hourly_rate:
          type: number
        description:
          type: string
        sponsor_name:
          type: string
        sponsor_logo_url:
          type: string
        county:
          type: string
        state:
          type: string

    ReassignUserCommunityInput:
      type: object
      required: [community_id]
      properties:
        community_id:
          type: integer
          nullable: true

    ModerateUserInput:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [warn, ban, suspend]
        reason:
          type: string
          description: Optional reason, used for suspend

    UserSummary:
      type: object
      description: Abbreviated user fields returned by the admin user list endpoint
      required: [id, name, email, is_helper, trust_score, help_count, is_suspended, created_at]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        is_helper:
          type: boolean
        trust_score:
          type: integer
        help_count:
          type: integer
        is_suspended:
          type: boolean
        suspended_at:
          type: ["string", "null"]
          format: date-time
        suspended_reason:
          type: ["string", "null"]
        created_at:
          type: string
          format: date-time

    UserSettings:
      type: object
      required:
        - id
        - user_id
        - notif_nearby_requests
        - notif_emergency
        - notif_task_accepted
        - notif_wallet_updates
        - notif_community_activity
        - notif_pledge_reminders
        - privacy_profile_visible
        - privacy_live_location
        - privacy_activity_sharing
        - privacy_anonymous_giving
        - service_radius_miles
        - preferred_language
        - spirit_animal
        - updated_at
      properties:
        id:
          type: integer
        user_id:
          type: integer
        notif_nearby_requests:
          type: boolean
        notif_emergency:
          type: boolean
        notif_task_accepted:
          type: boolean
        notif_wallet_updates:
          type: boolean
        notif_community_activity:
          type: boolean
        notif_pledge_reminders:
          type: boolean
        privacy_profile_visible:
          type: boolean
        privacy_live_location:
          type: boolean
        privacy_activity_sharing:
          type: boolean
        privacy_anonymous_giving:
          type: boolean
        service_radius_miles:
          type: number
        max_travel_miles:
          type: ["number", "null"]
        specialties:
          type: ["string", "null"]
        preferred_language:
          type: string
          enum: [en, sw, zu, tw, yo, ha, am, so, pcm, lg]
        spirit_animal:
          type: string
          description: Map avatar / navigation companion selected by the user
          enum: [sankofa_bird, black_panther, elephant, lion, fish_eagle]
        updated_at:
          type: string
          format: date-time

    UserSettingsUpdate:
      type: object
      description: All fields optional — only provided keys are persisted (upsert)
      properties:
        notif_nearby_requests:
          type: boolean
        notif_emergency:
          type: boolean
        notif_task_accepted:
          type: boolean
        notif_wallet_updates:
          type: boolean
        notif_community_activity:
          type: boolean
        notif_pledge_reminders:
          type: boolean
        privacy_profile_visible:
          type: boolean
        privacy_live_location:
          type: boolean
        privacy_activity_sharing:
          type: boolean
        privacy_anonymous_giving:
          type: boolean
        service_radius_miles:
          type: number
        max_travel_miles:
          type: number
        specialties:
          type: string
        preferred_language:
          type: string
          enum: [en, sw, zu, tw, yo, ha, am, so, pcm, lg]
        spirit_animal:
          type: string
          enum: [sankofa_bird, black_panther, elephant, lion, fish_eagle]

    AvailabilityWindow:
      type: object
      required: [id, user_id, day_of_week, start_min, end_min]
      properties:
        id:
          type: integer
        user_id:
          type: integer
        day_of_week:
          type: integer
          minimum: 0
          maximum: 6
          description: 0 = Sunday … 6 = Saturday
        start_min:
          type: integer
          minimum: 0
          maximum: 1439
          description: Minutes from midnight
        end_min:
          type: integer
          minimum: 1
          maximum: 1440
          description: Minutes from midnight

    AvailabilityWindowInput:
      type: object
      required: [day_of_week, start_min, end_min]
      properties:
        day_of_week:
          type: integer
          minimum: 0
          maximum: 6
        start_min:
          type: integer
          minimum: 0
          maximum: 1439
        end_min:
          type: integer
          minimum: 1
          maximum: 1440

    HelperApplicationUpdate:
      type: object
      description: |
        User mode (no status field): submit helper_skills, helper_languages,
        helper_qualifications, helper_bio, helper_vehicle, helper_social_links.
        Admin mode: send status to approve/deny an application.
      properties:
        status:
          type: string
          enum: [pending, approved, denied, rejected]
          description: Admin-only. "rejected" is normalized to "denied".
        helper_skills:
          type: array
          items:
            type: string
        helper_languages:
          type: array
          items:
            type: string
        helper_qualifications:
          type: array
          items:
            type: string
        helper_bio:
          type: string
        helper_vehicle:
          type: string
        helper_social_links:
          type: array
          items:
            type: string

    UserRegistration:
      type: object
      required: [name, email, password, tos_accepted]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          description: Plain-text password — hashed server-side with bcrypt (cost 12). Never stored or logged.
        tos_accepted:
          type: boolean
          description: Must be explicitly true; server enforces this regardless of frontend gating.
        avatar_url:
          type: string
        is_helper:
          type: boolean
        neighborhood:
          type: string
        account_type:
          type: string
          enum: [individual, organization, business, sponsor]
          default: individual
          description: Self-reported account type; business/sponsor/organization require admin review.
        organization_name:
          type: ["string", "null"]
          description: Required when account_type is organization, business, or sponsor.
        organization_description:
          type: ["string", "null"]
          description: Optional mission/description for organizations, businesses, and sponsors.

    LocationUpdate:
      type: object
      required: [lat, lng]
      properties:
        lat:
          type: number
        lng:
          type: number
        heading:
          type: ["number", "null"]
        speed:
          type: ["number", "null"]

    HelperModeUpdate:
      type: object
      required: [active]
      properties:
        active:
          type: boolean

    PledgePayment:
      type: object
      required: [request_id, amount]
      properties:
        request_id:
          type: integer
        amount:
          type: number
          minimum: 0.01
          description: Contribution amount in USD, must be greater than 0

    HelpRequest:
      type: object
      required: [id, title, category, status, payment_type, requester_id, lat, lng, created_at, pledge_paid]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        category:
          type: string
          enum: [groceries, transportation, errands, home_repair, medical, emergency, other, stock_shelves, event_setup, delivery_run, tech_support, local_farm, food_pantry, moving_labor, pet_care, childcare, senior_care, yard_work, tutoring, cleaning, meal_prep, paperwork, business_services, legal_aid, financial_coaching, job_assistance, language_help, mental_health_peer, technology_help]
        urgency:
          type: string
          enum: [low, medium, high, emergency]
        status:
          type: string
          enum: [open, claimed, en_route, arrived, completed, pay_it_forward_pending, pending_owner_approval, cancelled]
        payment_type:
          type: string
          enum: [immediate, pay_it_forward, goodwill]
          description: immediate=pay now, pay_it_forward=pay when able, goodwill=volunteer
        requester_id:
          type: integer
        requester_name:
          type: ["string", "null"]
        requester_avatar:
          type: ["string", "null"]
        helper_id:
          type: ["integer", "null"]
        helper_name:
          type: ["string", "null"]
        lat:
          type: number
        lng:
          type: number
        neighborhood:
          type: ["string", "null"]
        distance_miles:
          type: ["number", "null"]
        estimated_duration_min:
          type: ["integer", "null"]
        pay_it_forward_amount:
          type: ["number", "null"]
        pledge_amount:
          type: ["number", "null"]
        pledge_paid:
          type: number
          default: 0
        created_at:
          type: string
        claimed_at:
          type: ["string", "null"]
        en_route_at:
          type: ["string", "null"]
        arrived_at:
          type: ["string", "null"]
        completed_at:
          type: ["string", "null"]

    HelpRequestInput:
      type: object
      # requester_id is intentionally excluded from required — the server always
      # derives it from the auth token (req.authenticatedUserId). Clients that
      # send it will have it silently ignored; clients that omit it (the
      # standard case) work without change.
      required: [title, category, lat, lng]
      properties:
        title:
          type: string
        description:
          type: string
        category:
          type: string
          enum: [groceries, transportation, errands, home_repair, medical, emergency, other, stock_shelves, event_setup, delivery_run, tech_support, local_farm, food_pantry, moving_labor, pet_care, childcare, senior_care, yard_work, tutoring, cleaning, meal_prep, paperwork, business_services, legal_aid, financial_coaching, job_assistance, language_help, mental_health_peer, technology_help]
        urgency:
          type: string
          enum: [low, medium, high, emergency]
        payment_type:
          type: string
          enum: [immediate, pay_it_forward, goodwill]
        requester_id:
          type: integer
        lat:
          type: number
        lng:
          type: number
        neighborhood:
          type: string
        pay_it_forward_amount:
          type: number
        pledge_amount:
          type: number
        sensitive_acknowledged:
          type: boolean
          description: Required (must be true) for childcare, senior_care, and medical categories — requester acknowledges Niakofa is not a licensed childcare, homecare, or medical provider.
        business_id:
          type: integer
          nullable: true
          description: Optional. When set, the request is posted on behalf of this business. Server validates membership and blocks pay_it_forward.

    HelpRequestUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [open, claimed, en_route, arrived, completed, pay_it_forward_pending, pending_owner_approval, cancelled]
        description:
          type: string
        urgency:
          type: string
          enum: [low, medium, high, emergency]

    ClaimInput:
      type: object
      required: [helper_id]
      properties:
        helper_id:
          type: integer

    HelperIdInput:
      type: object
      required: [helper_id]
      properties:
        helper_id:
          type: integer

    CompleteInput:
      type: object
      # helper_id is derived from the authenticated token server-side.
      # It is never required in the request body.  Kept as an optional property
      # for backward compatibility with older clients that may still send it.
      properties:
        helper_id:
          type: integer
        notes:
          type: string

    RequestStats:
      type: object
