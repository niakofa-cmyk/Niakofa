    RepaymentPlanInput:
      type: object
      required: [plan_type, period, total_amount, start_date]
      properties:
        plan_type:
          type: string
          enum: [installments_2, installments_4]
          description: >
            "installments_2" splits into 2 equal payments;
            "installments_4" splits into 4 equal payments.
        period:
          type: string
          enum: [days_2, weeks_2, months_2, years_2]
          description: >
            Total span: days_2=2d, weeks_2=14d, months_2=60d, years_2=730d.
        total_amount:
          type: number
          description: Dollar amount to spread; server caps at outstanding pledge balance.
        start_date:
          type: string
          format: date
          description: First installment date (ISO 8601, must be today or future).

    RepaymentPlanResponse:
      type: object
      required: [success, total_amount, installment_count, amount_per_installment, message]
      properties:
        success:
          type: boolean
        plan_id:
          type: ["integer", "null"]
          description: ID of the repayment_plans header row (null when migration 0058 not yet applied).
        scheduled_payment_ids:
          type: array
          items:
            type: integer
          description: IDs of the created scheduled_payments rows.
        total_amount:
          type: number
        installment_count:
          type: integer
        amount_per_installment:
          type: number
        message:
          type: string

