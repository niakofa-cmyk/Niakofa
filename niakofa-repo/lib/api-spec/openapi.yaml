openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Niakofa - Map-First Community Help Platform
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User management
  - name: requests
    description: Help request operations
  - name: helpers
    description: Helper dispatch and tracking
  - name: navigation
    description: GPS routing and navigation
  - name: reports
    description: Trust and safety reporting
  - name: civic
    description: Location-aware civic and community resources
  - name: verification
    description: Identity verification and safety/panic features
  - name: businesses
    description: Business account applications and membership management
  - name: payments
    description: Stripe payment intents and Connect payouts
  - name: background-checks
    description: Checkr background check flow
  - name: admin
    description: Admin-only platform operations (analytics, moderation, Nia controls, communities)
  - name: griot
    description: Griot Globe diaspora hub stories, leaders, crisis status, and cross-hub pledges

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update user profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user account (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Account deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  message:
                    type: string
        "400":
          description: Invalid id
        "500":
          description: Failed to delete account

  /users/{id}/location:
    patch:
      operationId: updateUserLocation
      tags: [users]
      summary: Update user GPS location
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationUpdate"
      responses:
        "200":
          description: Location updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}/helper-mode:
    patch:
      operationId: updateHelperMode
      tags: [users]
      summary: Toggle helper mode on/off
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HelperModeUpdate"
      responses:
        "200":
          description: Helper mode updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}/pledge:
    post:
      operationId: makePledgePayment
      tags: [users]
      summary: Make a contribution toward a Niakofa pledge
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PledgePayment"
      responses:
        "200":
          description: Pledge payment recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpRequest"

  /users/{id}/change-password:
    post:
      operationId: changePassword
      tags: [users]
      summary: Authenticated password change — requires current password as proof of possession
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Password changed — returns user and a fresh auth token
          content:
            application/json:
              schema:
                type: object
                required: [user, token]
                properties:
                  user:
                    $ref: "#/components/schemas/User"
                  token:
                    type: string
        "400":
          description: Missing fields, password too short, or new password same as current
        "401":
          description: Current password is incorrect
        "403":
          description: LEGACY_PASSWORD_REQUIRED — account has no password yet, use set-initial-password first
        "404":
          description: User not found

  /users/register:
    get:
      operationId: registerUserHint
      tags: [users]
      summary: Placeholder — informs callers to use POST instead
      responses:
        "200":
          description: Hint message
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
    post:
      operationId: registerUser
      tags: [users]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRegistration"
      responses:
        "201":
          description: Registered user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /requests:
    get:
      operationId: getRequests
      tags: [requests]
      summary: List all help requests
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, claimed, en_route, arrived, completed, pay_it_forward_pending, pending_owner_approval, cancelled]
        - name: lat
          in: query
          schema:
            type: number
        - name: lng
          in: query
          schema:
            type: number
        - name: radius_miles
          in: query
          schema:
            type: number
      responses:
        "200":
          description: List of requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HelpRequest"
    post:
      operationId: createRequest
      tags: [requests]
      summary: Create a help request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HelpRequestInput"
      responses:
        "201":
          description: Created request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpRequest"

  /requests/nearby:
    get:
      operationId: getNearbyRequests
      tags: [requests]
      summary: Get help requests near a GPS location
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
        - name: lng
          in: query
          required: true
          schema:
            type: number
        - name: radius_miles
          in: query
          schema:
            type: number
            default: 5
      responses:
        "200":
          description: Nearby requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HelpRequest"

  /requests/stats:
    get:
      operationId: getRequestStats
      tags: [requests]
      summary: Get platform-wide request statistics
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestStats"

  /requests/{id}:
    get:
      operationId: getRequest
      tags: [requests]
      summary: Get a single help request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Help request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpRequest"
    patch:
      operationId: updateRequest
      tags: [requests]
      summary: Update a help request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HelpRequestUpdate"
      responses:
        "200":
          description: Updated request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpRequest"

  /requests/{id}/claim:
    post:
      operationId: claimRequest
      tags: [requests]
      summary: Helper claims a request to fulfill
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimInput"
      responses:
        "200":
          description: Claimed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpRequest"

  /requests/{id}/en-route:
    post:
      operationId: markEnRoute
      tags: [requests]
      summary: Helper marks themselves as en route to the request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HelperIdInput"
      responses:
        "200":
          description: Updated request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpRequest"

  /requests/{id}/arrived:
    post:
      operationId: markArrived
      tags: [requests]
      summary: Helper marks arrival at the request location
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HelperIdInput"
      responses:
        "200":
          description: Updated request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpRequest"

  /requests/{id}/complete:
    post:
      operationId: completeRequest
      tags: [requests]
      summary: Mark a request as completed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteInput"
      responses:
        "200":
          description: Completed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpRequest"

  /users/{id}/transactions:
    get:
      operationId: getUserTransactions
      tags: [users]
      summary: Get transaction history for a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Transaction list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"

  /users/{id}/scheduled-payment:
    post:
      operationId: createScheduledPayment
      tags: [users]
      summary: Schedule a future repayment for a Niakofa pledge
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduledPaymentInput"
      responses:
        "201":
          description: Scheduled payment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledPayment"
    get:
      operationId: getScheduledPayments
      tags: [users]
      summary: Get scheduled payments for a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Scheduled payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduledPayment"

  /users/{id}/outstanding-pledges:
    get:
      operationId: getUserOutstandingPledges
      tags: [users]
      summary: Get user's requests with outstanding pledge balances
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Requests with outstanding pledges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HelpRequest"

  /helpers/online:
    get:
      operationId: getOnlineHelpers
      tags: [helpers]
      summary: Get all currently online helpers
      parameters:
        - name: lat
          in: query
          schema:
            type: number
        - name: lng
          in: query
          schema:
            type: number
        - name: radius_miles
          in: query
          schema:
            type: number
            default: 10
      responses:
        "200":
          description: Online helpers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HelperLocation"

  /navigation/route:
    get:
      operationId: getRoute
      tags: [navigation]
      summary: Get driving route between two coordinates
      parameters:
        - name: start_lat
          in: query
          required: true
          schema:
            type: number
        - name: start_lng
          in: query
          required: true
          schema:
            type: number
        - name: end_lat
          in: query
          required: true
          schema:
            type: number
        - name: end_lng
          in: query
          required: true
          schema:
            type: number
        - name: profile
          in: query
          required: false
          schema:
            type: string
            enum: [driving, walking, cycling]
            default: driving
          description: Routing profile
        - name: lang
          in: query
          required: false
          schema:
            type: string
          description: BCP-47 language code for navigation voice instructions (e.g. "en", "fr", "sw"). Defaults to "en".
        - name: units
          in: query
          required: false
          schema:
            type: string
            enum: [imperial, metric]
            default: imperial
          description: Distance and voice units. Pass "metric" for km-based navigation.
      responses:
        "200":
          description: Route data with turn-by-turn steps
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteData"

  /civic/resources:
    get:
      operationId: getCivicResources
      tags: [civic]
      summary: Get location-aware civic and community resources
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
        - name: lng
          in: query
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Civic resources matched to the location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CivicResourcesResponse"
        "400":
          description: Missing or invalid lat/lng

  /civic/resources/nearby:
    get:
      operationId: getCivicResourcesNearby
      tags: [civic]
      summary: Get civic resources with map pins within a radius of a point, optionally filtered by category
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
        - name: lng
          in: query
          required: true
          schema:
            type: number
        - name: radius_miles
          in: query
          required: false
          schema:
            type: number
            default: 10
        - name: category
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Nearby resources with coordinates, sorted by distance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CivicResourceNearby"
        "400":
          description: Missing or invalid lat/lng

  /civic/needs/nearby:
    get:
      operationId: getCivicNeedsNearby
      tags: [civic]
      summary: Get open civic needs with map pins within a radius of a point
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
        - name: lng
          in: query
          required: true
          schema:
            type: number
        - name: radius_miles
          in: query
          required: false
          schema:
            type: number
            default: 25
      responses:
        "200":
          description: Nearby open civic needs with coordinates, sorted by distance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CivicNeedNearby"
        "400":
          description: Missing or invalid lat/lng

  /reports:
    post:
      operationId: createReport
      tags: [reports]
      summary: File a trust & safety report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReportInput"
      responses:
        "201":
          description: Report created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "400":
          description: Validation error
        "429":
          description: Rate limit exceeded
    get:
      operationId: getReports
      tags: [reports]
      summary: Admin — list all reports
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, under_review, resolved_dismissed, resolved_warned, resolved_banned]
      responses:
        "200":
          description: List of reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"

  /reports/{id}:
    get:
      operationId: getReport
      tags: [reports]
      summary: Admin — get a single report with enriched user info
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Report detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportDetail"
        "404":
          description: Not found

  /reports/{id}/review:
    patch:
      operationId: reviewReport
      tags: [reports]
      summary: Admin — update report status and add notes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminReviewInput"
      responses:
        "200":
          description: Updated report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "404":
          description: Not found

  /reports/griot-stories:
    get:
      operationId: getGriotStoryReports
      tags: [reports]
      summary: Admin — list reports filed against Griot Globe stories, enriched with story + author details
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, under_review, resolved_dismissed, resolved_warned, resolved_banned]
      responses:
        "200":
          description: List of Griot story reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GriotStoryReport"

  /users/{id}/reports:
    get:
      operationId: getUserReports
      tags: [reports]
      summary: Get reports filed by a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reports list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"

  /users/login:
    post:
      operationId: loginUser
      tags: [users]
      summary: Authenticate with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated — returns user and auth token
          content:
            application/json:
              schema:
                type: object
                required: [user, token]
                properties:
                  user:
                    $ref: "#/components/schemas/User"
                  token:
                    type: string
        "400":
          description: Email or password missing
        "401":
          description: No account found, or incorrect password
        "403":
          description: LEGACY_PASSWORD_REQUIRED — account predates password auth, use set-initial-password

  /users/request-password-reset:
    post:
      operationId: requestPasswordReset
      tags: [users]
      summary: Email a 6-digit sign-in code (legacy-account setup and forgot-password flow)
      description: Always returns 200 regardless of whether the email exists, to avoid leaking which emails are registered.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestPasswordResetInput"
      responses:
        "200":
          description: Code sent if the account exists (response does not reveal which)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "400":
          description: Email missing

  /users/set-initial-password:
    post:
      operationId: setInitialPassword
      tags: [users]
      summary: Verify the emailed code and set a password (legacy-account / reset completion)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetInitialPasswordInput"
      responses:
        "200":
          description: Password set — returns user and a fresh auth token
          content:
            application/json:
              schema:
                type: object
                required: [user, token]
                properties:
                  user:
                    $ref: "#/components/schemas/User"
                  token:
                    type: string
        "400":
          description: Missing fields, password too short, incorrect code, or code expired
        "404":
          description: Account not found

  /users/{id}/scheduled-payment/{paymentId}:
    delete:
      operationId: deleteScheduledPayment
      tags: [users]
      summary: Cancel a scheduled payment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: paymentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Scheduled payment cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  deleted_id:
                    type: integer
        "400":
          description: Invalid id
        "404":
          description: Scheduled payment not found or does not belong to this user

  /users/{id}/avatar:
    post:
      operationId: updateUserAvatar
      tags: [users]
      summary: Update profile photo (base64 data URL)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserAvatarInput"
      responses:
        "200":
          description: Avatar updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid or missing image data
        "404":
          description: User not found
        "413":
          description: Image too large — max 5 MB

  /users/{id}/settings:
    get:
      operationId: getUserSettings
      tags: [users]
      summary: Get notification and privacy preferences (creates defaults on first visit)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Existing settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettings"
        "201":
          description: Default settings created on first visit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettings"
    put:
      operationId: updateUserSettings
      tags: [users]
      summary: Persist notification and privacy preferences
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSettingsUpdate"
      responses:
        "200":
          description: Settings upserted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettings"

  /verification/panic-contacts/{userId}:
    patch:
      operationId: updatePanicContacts
      tags: [verification]
      summary: Update emergency/panic contacts (max 5) — the route the frontend actually calls
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePanicContactsInput"
      responses:
        "200":
