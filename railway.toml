[build]
builder = "railpack"

[deploy]
startCommand = "pnpm --filter @workspace/db run migrate && (while true; do PORT=3001 node --enable-source-maps artifacts/nia-service/dist/index.js; echo 'nia-service exited — restarting in 3s'; sleep 3; done &) && node --enable-source-maps artifacts/api-server/dist/index.mjs"
