[build]
builder = "railpack"
buildCommand = "NODE_ENV=development pnpm install --frozen-lockfile && pnpm run typecheck:libs && pnpm --filter @workspace/api-spec run codegen && pnpm --filter @workspace/api-server run build && BASE_PATH=/ pnpm --filter @workspace/pay-it-forward run build"

[deploy]
startCommand = "pnpm --filter @workspace/db run migrate && node --enable-source-maps artifacts/api-server/dist/index.mjs"
