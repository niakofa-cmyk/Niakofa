<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0f1e" />
    <title>You're Offline — Niakofa</title>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html, body {
        height: 100%;
      }

      body {
        background-color: #0a0f1e;
        color: #e2e8f0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100%;
        padding: 2rem 1.5rem;
        text-align: center;
      }

      .icon-wrap {
        width: 88px;
        height: 88px;
        border-radius: 22px;
        background: #FF3C00;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 2rem;
        flex-shrink: 0;
      }

      .icon-wrap svg {
        width: 48px;
        height: 48px;
        color: #fff;
      }

      h1 {
        font-size: 1.75rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #f1f5f9;
        margin-bottom: 0.75rem;
      }

      p {
        font-size: 1rem;
        line-height: 1.6;
        color: #94a3b8;
        max-width: 320px;
        margin-bottom: 2rem;
      }

      .tagline {
        font-size: 0.8125rem;
        color: #475569;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        margin-bottom: 2.5rem;
      }

      button {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        background: #FF3C00;
        color: #fff;
        border: none;
        border-radius: 12px;
        font-size: 0.9375rem;
        font-weight: 600;
        padding: 0.75rem 1.75rem;
        cursor: pointer;
        transition: opacity 0.15s ease, transform 0.1s ease;
        -webkit-tap-highlight-color: transparent;
      }

      button:hover {
        opacity: 0.88;
      }

      button:active {
        transform: scale(0.97);
      }

      .divider {
        width: 1px;
        height: 1px;
        background: transparent;
        margin-top: 3rem;
      }

      .footer {
        position: absolute;
        bottom: 2rem;
        font-size: 0.75rem;
        color: #334155;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <div class="icon-wrap" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23" />
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
        <path d="M10.71 5.05A16 16 0 0 1 22.56 9" />
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
        <line x1="12" y1="20" x2="12.01" y2="20" />
      </svg>
    </div>

    <h1>You're offline</h1>
    <p>
      Niakofa needs a connection to show real-time help requests and your neighbors nearby.
      Check your Wi-Fi or mobile data, then try again.
    </p>
    <p class="tagline">Help Today &middot; Pay It Forward Tomorrow</p>

    <button onclick="retry()" id="retryBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.25"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="23 4 23 10 17 10" />
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
      </svg>
      Try again
    </button>

    <p class="footer">Niakofa &mdash; Community Help &middot; Tarrant County, TX</p>

    <script>
      function retry() {
        const btn = document.getElementById("retryBtn");
        btn.disabled = true;
        btn.style.opacity = "0.5";
        window.location.reload();
      }

      // Auto-reload when connectivity is restored
      window.addEventListener("online", () => {
        window.location.reload();
      });
    </script>
  </body>
</html>
