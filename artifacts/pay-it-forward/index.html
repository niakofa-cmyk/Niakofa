    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!--
      Zero-flash animation-preference init.
      Runs synchronously before the React bundle loads so that
      html[data-bird-anim="enabled"] is already present on the very first
      paint — no useEffect latency, no one-frame reduced-motion flash on iOS.
      Must stay as a plain inline <script>, NOT type="module" (modules are
      deferred and would fire too late, after the first render).
    -->
    <script>
      try {
        if (localStorage.getItem('niakofa_bird_anim') === 'enabled') {
          document.documentElement.setAttribute('data-bird-anim', 'enabled');
        }
      } catch (e) { /* localStorage blocked in private mode — safe to ignore */ }
    </script>
  </head>
  <body>
    <div id="root">
      <div
        id="app-loading"
        role="status"
        aria-live="polite"
        style="min-height:100vh;display:grid;place-items:center;background:#0e0805;color:#f5c842;font-family:Inter,system-ui,sans-serif;padding:24px;text-align:center"
      >
        <div>
          <div style="font-size:12px;font-weight:800;letter-spacing:.24em;text-transform:uppercase">Niakofa Legacy</div>
          <div style="margin-top:10px;font-size:14px;color:#d8c9a2">Opening the living family archive…</div>
        </div>
      </div>
    </div>
    <noscript>
      <div style="padding:24px;font-family:system-ui,sans-serif">JavaScript is required to play Niakofa Legacy.</div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
