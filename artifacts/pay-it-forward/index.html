    <!--
      Zero-flash animation-preference init.
      Runs synchronously before the React bundle loads so that
      html[data-bird-anim="enabled"] is already present on the very first
      paint — no useEffect latency, no one-frame reduced-motion flash on iOS.
      Must stay as a plain inline <script>, NOT type="module" (modules are
      deferred and would fire too late, after the first render).
    -->
    <script>
      try {
        if (localStorage.getItem('niakofa_bird_anim') === 'enabled') {
          document.documentElement.setAttribute('data-bird-anim', 'enabled');
        }
      } catch (e) { /* localStorage blocked in private mode — safe to ignore */ }
    </script>

    <script type="module" src="/src/main.tsx"></script>
