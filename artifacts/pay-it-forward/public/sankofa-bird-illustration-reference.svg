<!--
  SANKOFA BIRD — ILLUSTRATION REFERENCE (Pre-Phase 1 hand-composed style)
  =========================================================================
  This is the ORIGINAL illustration-style Sankofa bird.
  It was hand-composed using ellipses, circles, and paths.
  
  Visual DNA to carry forward into the animated bird:
    • #00D4FF / #00C4EE bright cyan as primary feather color
    • Multiple semi-transparent overlapping shapes (opacity 0.85, 0.75, 0.70, 0.60)
    • Dreamlike, luminous appearance — feathers glow from within
    • Sankofa Adinkra spiral on the body (the symbolic heart)
    • Golden beak + warm red/orange egg — symbolic warmth against cool cyan
    • Layered translucency creating depth without hard edges
    • Strong contrast: deep #0A1628 eye against bright #00D4FF body
  
  Art direction notes (from design brief):
    "I'd borrow the brighter cyan highlights, the layered transparency,
     the soft glowing overlap between feathers, the richer color transitions.
     Then apply those treatments to the newer, anatomically stronger bird."
  
  Use this file as visual inspiration — NOT as a replacement for the
  current rigged bird. The goal is Real bird anatomy + symbolic visual language.
  
  =========================================================================
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" fill="none">
  <!-- Transparent background -->

  <!-- ── Tail feathers (left side, fanned out) ── -->
  <!-- Three overlapping semi-transparent ellipses — the signature layered look -->
  <ellipse cx="42" cy="112" rx="18" ry="7" fill="#00D4FF" opacity="0.85" transform="rotate(-35 42 112)"/>
  <ellipse cx="36" cy="124" rx="18" ry="6" fill="#00C4EE" opacity="0.75" transform="rotate(-15 36 124)"/>
  <ellipse cx="30" cy="100" rx="16" ry="6" fill="#00D4FF" opacity="0.70" transform="rotate(-55 30 100)"/>

  <!-- ── Main body ── -->
  <!-- Full-opacity base ellipse + semi-transparent wing overlays layered on top -->
  <ellipse cx="90" cy="108" rx="44" ry="28" fill="#00D4FF"/>

  <!-- ── Wing detail (two overlapping translucent ellipses — depth + shimmer) ── -->
  <ellipse cx="82" cy="96" rx="30" ry="16" fill="#00B8E0" opacity="0.8" transform="rotate(-15 82 96)"/>
  <ellipse cx="96" cy="94" rx="22" ry="11" fill="#00D4FF" opacity="0.6" transform="rotate(10 96 94)"/>

  <!-- ── Neck ── -->
  <ellipse cx="116" cy="82" rx="13" ry="18" fill="#00D4FF" transform="rotate(25 116 82)"/>

  <!-- ── Head (turned back — facing right, the classic Sankofa pose) ── -->
  <circle cx="128" cy="62" r="20" fill="#00D4FF"/>

  <!-- ── Eye ── -->
  <circle cx="136" cy="57" r="5" fill="#0A1628"/>
  <circle cx="137.5" cy="55.5" r="1.8" fill="white"/>

  <!-- ── Beak (golden — warmth against cool body) ── -->
  <path d="M145 58 Q155 52 152 62 Q148 68 141 65 Z" fill="#FFD700"/>

  <!-- ── Heart / egg in beak (symbolic warmth — the pay-it-forward heart) ── -->
  <path d="M148 56 Q150 52 153 55 Q156 52 158 56 Q158 62 153 66 Q148 62 148 56Z" fill="#FF6B6B" opacity="0.9"/>

  <!-- ── Feet / legs ── -->
  <line x1="75"  y1="132" x2="68"  y2="150" stroke="#00B8E0" stroke-width="4" stroke-linecap="round"/>
  <line x1="88"  y1="134" x2="84"  y2="152" stroke="#00B8E0" stroke-width="4" stroke-linecap="round"/>
  <!-- Toes -->
  <line x1="68"  y1="150" x2="60"  y2="155" stroke="#00B8E0" stroke-width="3" stroke-linecap="round"/>
  <line x1="68"  y1="150" x2="68"  y2="158" stroke="#00B8E0" stroke-width="3" stroke-linecap="round"/>
  <line x1="68"  y1="150" x2="76"  y2="155" stroke="#00B8E0" stroke-width="3" stroke-linecap="round"/>
  <line x1="84"  y1="152" x2="76"  y2="157" stroke="#00B8E0" stroke-width="3" stroke-linecap="round"/>
  <line x1="84"  y1="152" x2="84"  y2="160" stroke="#00B8E0" stroke-width="3" stroke-linecap="round"/>
  <line x1="84"  y1="152" x2="92"  y2="157" stroke="#00B8E0" stroke-width="3" stroke-linecap="round"/>

  <!-- ── Sankofa Adinkra spiral on body (symbolic heart of the design) ── -->
  <!-- The spiral represents "go back and fetch it" — the Sankofa principle -->
  <path d="M85 108 Q92 100 100 108 Q108 116 100 124 Q92 132 84 124"
        stroke="#0A1628" stroke-width="2.5" fill="none" opacity="0.5"
        stroke-linecap="round"/>

  <!-- ── Luminous edge glow (the magic: soft outer glow that made this special) ── -->
  <!-- SVG filters are not embedded here; recreate via CSS drop-shadow in the animation system -->
</svg>
