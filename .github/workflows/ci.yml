name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  spiral-source-fix:
    name: Spiral Source Fix
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/spirals-map-locator-canonical'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Replace legacy Spiral GPS path
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('artifacts/pay-it-forward/src/pages/audio-circles.tsx')
          text = path.read_text()

          old_import = 'import { CircleStartLocationError, getFreshCircleStartLocation } from "@/lib/circleStartLocation";'
          new_import = 'import { CircleStartLocationError } from "@/lib/circleStartLocation";\nimport { getUsableMapLocation, mapLocationUnavailableMessage } from "@/lib/spiralMapLocation";'
          if old_import not in text:
              raise SystemExit('expected legacy location import not found')
          text = text.replace(old_import, new_import, 1)

          old_discovery = '''        const shared = locationRef.current;
        const usable =
          shared?.source === "gps" &&
          typeof shared.capturedAt === "number" &&
          Date.now() - shared.capturedAt <= 120_000 &&
          typeof shared.accuracy === "number" &&
          shared.accuracy <= 150;
        const location = usable
          ? {
              latitude: shared.lat,
              longitude: shared.lng,
              accuracy_meters: shared.accuracy!,
              captured_at: new Date(shared.capturedAt!).toISOString(),
            }
          : await getFreshCircleStartLocation();'''
          new_discovery = '''        const shared = getUsableMapLocation(locationRef.current, Date.now(), "discovery");
        if (!shared) {
          throw new CircleStartLocationError("MAP_LOCATION_UNAVAILABLE", mapLocationUnavailableMessage());
        }
        const location = {
          latitude: shared.lat,
          longitude: shared.lng,
          accuracy_meters: shared.accuracy,
          captured_at: new Date(shared.capturedAt).toISOString(),
        };'''
          if old_discovery not in text:
              raise SystemExit('expected discovery fallback block not found')
          text = text.replace(old_discovery, new_discovery, 1)

          old_host = '      const location = await getFreshCircleStartLocation();'
          new_host = '''      const shared = getUsableMapLocation(myLocation, Date.now(), "host");
      if (!shared) {
        throw new CircleStartLocationError("MAP_LOCATION_UNAVAILABLE", mapLocationUnavailableMessage());
      }
      const location = {
        latitude: shared.lat,
        longitude: shared.lng,
        accuracy_meters: shared.accuracy,
        captured_at: new Date(shared.capturedAt).toISOString(),
      };'''
          if old_host not in text:
              raise SystemExit('expected host fallback line not found')
          text = text.replace(old_host, new_host, 1)

          if 'getFreshCircleStartLocation' in text:
              raise SystemExit('legacy getFreshCircleStartLocation remains')

          path.write_text(text)
          PY

      - name: Commit canonical Spiral source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/pay-it-forward/src/pages/audio-circles.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(spirals): remove legacy GPS fallback from Spiral page"
          git push origin HEAD:${{ github.head_ref }}

  architectural-boundary:
    name: App/AI Boundary Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check App/AI separation
        run: node scripts/src/check-app-ai-boundary.js

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run ESLint
        run: npx eslint . --max-warnings 0

  typecheck-and-test:
    name: Typecheck + Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck (all packages)
        run: pnpm run typecheck
      - name: Run frontend Map Locator regression
        run: node --import tsx/esm --test artifacts/pay-it-forward/src/lib/__tests__/spiral-map-location.test.ts
      - name: Run backend tests
        run: pnpm --filter @workspace/api-server run test
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          SESSION_SECRET: ci-test-secret-64-chars-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      - name: Apply database migrations
        run: pnpm --filter @workspace/db run migrate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          DATABASE_SSL: "false"
      - name: Run civic seed regression
        run: pnpm --filter @workspace/scripts run test:civic-seed
        env:
          CIVIC_SEED_TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test
      - name: Run Diaspora source contracts
        run: pnpm run test:diaspora
      - name: Run nia-service tests
        run: pnpm --filter nia-service run test
        env:
          SESSION_SECRET: ci-test-secret-64-chars-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      - name: Run App/AI boundary tests
        run: cd artifacts/api-server && node --experimental-vm-modules node_modules/jest/bin/jest.js --config ./jest.config.mjs --runInBand src/__tests__/app-ai-boundary.test.ts
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          SESSION_SECRET: ci-test-secret-64-chars-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

  release-validation:
    name: Release Validation
    runs-on: ubuntu-latest
    needs: [architectural-boundary, lint, typecheck-and-test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pre-deployment validation
        run: node scripts/src/release-validate.js
      - name: Production gate fail-closed tests
        run: pnpm run test:production-gate
