name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  architectural-boundary:
    name: App/AI Boundary Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check App/AI separation
        run: node scripts/src/check-app-ai-boundary.js

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run ESLint
        run: npx eslint . --max-warnings 0 || echo "ESLint warnings found (non-blocking)"

  typecheck-and-test:
    name: Typecheck + Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck (all packages)
        run: pnpm run typecheck
      - name: Run backend tests
        run: pnpm --filter @workspace/api-server run test
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          SESSION_SECRET: ci-test-secret-64-chars-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      - name: Run nia-service tests
        run: pnpm --filter nia-service run test
        env:
          SESSION_SECRET: ci-test-secret-64-chars-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      - name: Run App/AI boundary tests
        run: pnpm --filter @workspace/api-server run test -- --testPathPattern="app-ai-boundary"
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          SESSION_SECRET: ci-test-secret-64-chars-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

  release-validation:
    name: Release Validation
    runs-on: ubuntu-latest
    needs: [architectural-boundary, lint, typecheck-and-test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pre-deployment validation
        run: node scripts/src/release-validate.js
