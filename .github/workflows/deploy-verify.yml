name: Deploy Verification

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-deployment:
    name: Verify Production Deployment
    runs-on: ubuntu-latest
    env:
      PRODUCTION_URL: https://zesty-ambition-production-f6a1.up.railway.app
    steps:
      - name: Wait for deployment
        run: sleep 45

      - name: Check API and Nia health endpoints
        run: |
          set -euo pipefail
          for path in /api/healthz /api/health; do
            echo "Checking ${path}..."
            for attempt in $(seq 1 6); do
              if curl --fail --silent --show-error --max-time 15 "${PRODUCTION_URL}${path}" | tee "/tmp/health-${attempt}.json"; then
                echo
                break
              fi
              if [ "$attempt" -eq 6 ]; then
                echo "Health check failed for ${path}"
                exit 1
              fi
              echo "Retrying ${path}..."
              sleep 10
            done
          done

      - name: Verify critical endpoints
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 "${PRODUCTION_URL}/api/healthz" | jq .
