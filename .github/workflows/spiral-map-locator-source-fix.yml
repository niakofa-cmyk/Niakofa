name: Spiral Map Locator Source Fix

on:
  push:
    branches: [fix/spirals-map-locator-canonical]

permissions:
  contents: write

jobs:
  apply-source-fix:
    if: github.ref == 'refs/heads/fix/spirals-map-locator-canonical'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace legacy Spiral GPS path
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('artifacts/pay-it-forward/src/pages/audio-circles.tsx')
          text = path.read_text()

          old_import = 'import { CircleStartLocationError, getFreshCircleStartLocation } from "@/lib/circleStartLocation";'
          new_import = 'import { CircleStartLocationError } from "@/lib/circleStartLocation";\nimport { getUsableMapLocation, mapLocationUnavailableMessage } from "@/lib/spiralMapLocation";'
          if old_import not in text:
              raise SystemExit('expected legacy location import not found')
          text = text.replace(old_import, new_import, 1)

          old_discovery = '''        const shared = locationRef.current;
        const usable =
          shared?.source === "gps" &&
          typeof shared.capturedAt === "number" &&
          Date.now() - shared.capturedAt <= 120_000 &&
          typeof shared.accuracy === "number" &&
          shared.accuracy <= 150;
        const location = usable
          ? {
              latitude: shared.lat,
              longitude: shared.lng,
              accuracy_meters: shared.accuracy!,
              captured_at: new Date(shared.capturedAt!).toISOString(),
            }
          : await getFreshCircleStartLocation();'''
          new_discovery = '''        const shared = getUsableMapLocation(locationRef.current, Date.now(), "discovery");
        if (!shared) {
          throw new CircleStartLocationError("MAP_LOCATION_UNAVAILABLE", mapLocationUnavailableMessage());
        }
        const location = {
          latitude: shared.lat,
          longitude: shared.lng,
          accuracy_meters: shared.accuracy,
          captured_at: new Date(shared.capturedAt).toISOString(),
        };'''
          if old_discovery not in text:
              raise SystemExit('expected discovery fallback block not found')
          text = text.replace(old_discovery, new_discovery, 1)

          old_host = '      const location = await getFreshCircleStartLocation();'
          new_host = '''      const shared = getUsableMapLocation(myLocation, Date.now(), "host");
      if (!shared) {
        throw new CircleStartLocationError("MAP_LOCATION_UNAVAILABLE", mapLocationUnavailableMessage());
      }
      const location = {
        latitude: shared.lat,
        longitude: shared.lng,
        accuracy_meters: shared.accuracy,
        captured_at: new Date(shared.capturedAt).toISOString(),
      };'''
          if old_host not in text:
              raise SystemExit('expected host fallback line not found')
          text = text.replace(old_host, new_host, 1)

          if 'getFreshCircleStartLocation' in text:
              raise SystemExit('legacy getFreshCircleStartLocation remains')

          path.write_text(text)
          PY

      - name: Verify source no longer uses legacy Spiral GPS
        run: |
          ! grep -n "getFreshCircleStartLocation" artifacts/pay-it-forward/src/pages/audio-circles.tsx
          grep -n 'getUsableMapLocation.*"discovery"' artifacts/pay-it-forward/src/pages/audio-circles.tsx
          grep -n 'getUsableMapLocation.*"host"' artifacts/pay-it-forward/src/pages/audio-circles.tsx

      - name: Commit canonical source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/pay-it-forward/src/pages/audio-circles.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix(spirals): remove legacy GPS fallback from Spiral page"
          git push origin HEAD:fix/spirals-map-locator-canonical
