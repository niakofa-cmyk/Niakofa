name: Spiral Source Fix

on:
  push:
    branches: [fix/spirals-map-locator-canonical]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace legacy location calls in Spiral page
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path("artifacts/pay-it-forward/src/pages/audio-circles.tsx")
          s = p.read_text()
          s2 = s.replace(
              'import { CircleStartLocationError, getFreshCircleStartLocation } from "@/lib/circleStartLocation";',
              'import { CircleStartLocationError } from "@/lib/circleStartLocation";\nimport { getUsableMapLocation, mapLocationUnavailableMessage } from "@/lib/spiralMapLocation";',
              1,
          )
          if s2 == s:
              raise SystemExit("legacy import not found")
          pattern = re.compile(r'''        const shared = locationRef\.current;\n        const usable =\n          shared\?\.source === "gps" &&\n          typeof shared\.capturedAt === "number" &&\n          Date\.now\(\) - shared\.capturedAt <= 120_000 &&\n          typeof shared\.accuracy === "number" &&\n          shared\.accuracy <= 150;\n        const location = usable\n          \? \{\n              latitude: shared\.lat,\n              longitude: shared\.lng,\n              accuracy_meters: shared\.accuracy!,\n              captured_at: new Date\(shared\.capturedAt!\)\.toISOString\(\),\n            \}\n          : await getFreshCircleStartLocation\(\);''')
          replacement = '''        const shared = getUsableMapLocation(locationRef.current, Date.now(), "discovery");
        if (!shared) {
          throw new CircleStartLocationError("MAP_LOCATION_UNAVAILABLE", mapLocationUnavailableMessage());
        }
        const location = {
          latitude: shared.latitude,
          longitude: shared.longitude,
          accuracy_meters: shared.accuracy_meters,
          captured_at: shared.captured_at,
        };'''
          s2, n = pattern.subn(replacement, s2, count=1)
          if n != 1:
              raise SystemExit("legacy discovery block not found")
          s2, n = re.subn(
              r'      const location = await getFreshCircleStartLocation\(\);',
              '''      const shared = getUsableMapLocation(myLocation, Date.now(), "host");
      if (!shared) {
        throw new CircleStartLocationError("MAP_LOCATION_UNAVAILABLE", mapLocationUnavailableMessage());
      }
      const location = {
        latitude: shared.latitude,
        longitude: shared.longitude,
        accuracy_meters: shared.accuracy_meters,
        captured_at: shared.captured_at,
      };''',
              s2,
              count=1,
          )
          if n != 1:
              raise SystemExit("legacy host call not found")
          if "getFreshCircleStartLocation" in s2:
              raise SystemExit("legacy Spiral GPS call remains")
          p.write_text(s2)
      - name: Verify canonical Spiral location source
        run: |
          ! grep -n "getFreshCircleStartLocation" artifacts/pay-it-forward/src/pages/audio-circles.tsx
          grep -n 'getUsableMapLocation.*"discovery"' artifacts/pay-it-forward/src/pages/audio-circles.tsx
          grep -n 'getUsableMapLocation.*"host"' artifacts/pay-it-forward/src/pages/audio-circles.tsx
      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/pay-it-forward/src/pages/audio-circles.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix(spirals): use Map Locator for discovery and host start"
          git push origin HEAD:fix/spirals-map-locator-canonical
