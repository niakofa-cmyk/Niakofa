name: repair-audio-circles-mock

on:
  push:
    branches:
      - fix/audio-circles-neighborhood-schema-mock

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add missing schema mock export
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("artifacts/api-server/src/__tests__/audio-circles.test.ts")
          s = p.read_text()
          needle = '    cityNeighborhoodsTable: { id: "id", name: "name", emoji: "emoji" },\n'
          addition = needle + '    neighborhoodBoundaryImportsTable: { id: "id", city_key: "city_key", neighborhood_id: "neighborhood_id" },\n'
          if "neighborhoodBoundaryImportsTable:" not in s:
              if needle not in s:
                  raise SystemExit("mock insertion point not found")
              s = s.replace(needle, addition, 1)
              p.write_text(s)
          PY
      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/__tests__/audio-circles.test.ts
          git rm .github/workflows/repair-audio-circles-mock.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test: add neighborhood boundary import mock"
          git push
