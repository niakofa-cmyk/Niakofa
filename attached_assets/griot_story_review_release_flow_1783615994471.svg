<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 640">
<title fill="rgb(0, 0, 0)" stroke="none" stroke-width="1px" stroke-linecap="butt" stroke-linejoin="miter" opacity="1" font-family="&quot;Anthropic Sans&quot;, -apple-system, system-ui, &quot;Segoe UI&quot;, sans-serif" font-size="16px" font-weight="400" text-anchor="start">Griot story review and release flow</title>
<desc fill="rgb(0, 0, 0)" stroke="none" stroke-width="1px" stroke-linecap="butt" stroke-linejoin="miter" opacity="1" font-family="&quot;Anthropic Sans&quot;, -apple-system, system-ui, &quot;Segoe UI&quot;, sans-serif" font-size="16px" font-weight="400" text-anchor="start">A story is recorded, Nia automatically transcribes and translates it, the recorder reviews the translation for accuracy, the recorder sets visibility and release timing, then it publishes to the globe as public by default with an opt-out to private.</desc>
