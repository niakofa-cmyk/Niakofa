<div style="display:flex;justify-content:center;padding:1rem 0">
<div style="width:300px;height:620px;border-radius:36px;border:0.5px solid var(--border-strong);background:var(--surface-1);position:relative;overflow:hidden">

<div style="position:absolute;inset:0;background:
  radial-gradient(circle at 30% 25%, var(--bg-success) 0%, transparent 12%),
  radial-gradient(circle at 62% 18%, var(--bg-accent) 0%, transparent 10%),
  radial-gradient(circle at 75% 45%, var(--bg-success) 0%, transparent 12%),
  radial-gradient(circle at 20% 60%, var(--bg-accent) 0%, transparent 10%),
  var(--surface-2)">
  <svg width="100%" height="100%" style="position:absolute;inset:0;opacity:0.35">
    <line x1="0" y1="90" x2="300" y2="140" stroke="var(--border-strong)" stroke-width="2"/>
    <line x1="60" y1="0" x2="90" y2="620" stroke="var(--border-strong)" stroke-width="2"/>
    <line x1="200" y1="0" x2="180" y2="620" stroke="var(--border-strong)" stroke-width="2"/>
    <line x1="0" y1="320" x2="300" y2="300" stroke="var(--border-strong)" stroke-width="2"/>
  </svg>
</div>

<div style="position:absolute;top:12px;left:12px;right:12px;display:flex;align-items:center;justify-content:space-between">
  <div style="width:40px;height:40px;border-radius:50%;background:var(--bg-success);border:0.5px solid var(--border-success);display:flex;align-items:center;justify-content:center">
    <i class="ti ti-building-community" style="font-size:18px;color:var(--text-success)" aria-label="Civic portal"></i>
  </div>
  <div style="height:40px;padding:0 14px;border-radius:20px;background:var(--surface-3);border:0.5px solid var(--border);display:flex;align-items:center;gap:6px">
    <i class="ti ti-search" style="font-size:14px" aria-hidden="true"></i>
    <span style="font-size:12px;color:var(--text-secondary)">Search this area</span>
  </div>
  <div style="width:34px;height:34px;border-radius:50%;background:var(--surface-3);border:0.5px solid var(--border);display:flex;align-items:center;justify-content:center">
    <i class="ti ti-user" style="font-size:15px" aria-label="Profile"></i>
  </div>
</div>

<div style="position:absolute;top:64px;right:12px;height:32px;padding:0 12px;border-radius:16px;background:var(--surface-3);border:0.5px solid var(--border);display:flex;align-items:center;gap:8px">
  <i class="ti ti-heart-handshake" style="font-size:13px;color:var(--text-success)" aria-hidden="true"></i>
  <span style="font-size:12px;font-weight:500;color:var(--text-success)">12 helpers</span>
  <i class="ti ti-building-community" style="font-size:13px;color:var(--text-accent)" aria-hidden="true"></i>
  <span style="font-size:12px;font-weight:500;color:var(--text-accent)">5 needs</span>
</div>

<div style="position:absolute;left:14px;bottom:150px;width:46px;height:46px;border-radius:50%;background:var(--surface-3);border:0.5px solid var(--border);display:flex;align-items:center;justify-content:center">
  <i class="ti ti-adjustments-horizontal" style="font-size:19px" aria-label="Map settings"></i>
</div>

<div style="position:absolute;right:14px;bottom:150px;display:flex;flex-direction:column;gap:8px">
  <div style="width:40px;height:40px;border-radius:50%;background:var(--surface-3);border:0.5px solid var(--border);display:flex;align-items:center;justify-content:center">
    <i class="ti ti-compass" style="font-size:17px" aria-label="Orientation"></i>
  </div>
  <div style="width:40px;height:40px;border-radius:50%;background:var(--fill-accent);display:flex;align-items:center;justify-content:center">
    <i class="ti ti-current-location" style="font-size:17px;color:var(--on-accent)" aria-label="Recenter"></i>
  </div>
</div>

<div style="position:absolute;left:0;right:0;bottom:0;height:150px;background:var(--surface-1);border-top:0.5px solid var(--border);border-radius:20px 20px 0 0;padding:10px 16px">
  <div style="width:36px;height:4px;border-radius:2px;background:var(--border-strong);margin:0 auto 10px"></div>
  <div style="display:flex;align-items:center;justify-content:space-between">
    <div style="width:32px;height:32px;border-radius:50%;background:var(--surface-2);border:0.5px solid var(--border);display:flex;align-items:center;justify-content:center">
      <i class="ti ti-filter" style="font-size:14px" aria-label="Filters"></i>
    </div>
    <span style="font-size:15px;font-weight:500">Helpers and civic needs</span>
    <div style="width:32px;height:32px;border-radius:50%;background:var(--surface-2);border:0.5px solid var(--border);display:flex;align-items:center;justify-content:center">
      <i class="ti ti-list" style="font-size:14px" aria-label="List view"></i>
    </div>
  </div>
  <div style="margin-top:10px;height:44px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;padding:0 12px;gap:10px">
    <i class="ti ti-heart-handshake" style="font-size:16px;color:var(--text-success)" aria-hidden="true"></i>
    <span style="font-size:13px;color:var(--text-secondary)">Maria — handyman, Spanish — 0.4 mi</span>
  </div>
  <div style="margin-top:6px;height:44px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;padding:0 12px;gap:10px">
    <i class="ti ti-building-community" style="font-size:16px;color:var(--text-accent)" aria-hidden="true"></i>
    <span style="font-size:13px;color:var(--text-secondary)">Food pantry — open now — 0.6 mi</span>
  </div>
</div>

</div>
</div>
