# coturn config for Niakofa Circles TURN relay.
#
# This MUST match the auth scheme in api-server/src/routes/webrtc-ice.ts:
# static-auth-secret mode, where the server mints a per-request
# username/credential pair signed with the same shared secret configured
# here. Nothing long-lived is ever sent to the browser.
#
# Setup: see README.md in this directory for the full walkthrough.

# --- Networking ---
# Standard TURN port. If you also want a TLS-secured TURN listener (turns:),
# uncomment tls-listening-port and provide cert/pkey paths below.
listening-port=3478
# tls-listening-port=5349

# Replace with this server's actual public IP (not a hostname, not 0.0.0.0).
# Required so coturn advertises the correct address in TURN allocations —
# without this, clients behind certain NATs can fail to relay correctly.
external-ip=REPLACE_WITH_SERVER_PUBLIC_IP

# Relay port range — must be open (UDP) in your VPS firewall/security group.
# 3478/udp, 3478/tcp, and this whole range need to be reachable.
min-port=49152
max-port=49252

# --- Auth: static-auth-secret scheme ---
# This is the ONE secret shared between coturn and the API server's
# TURN_STATIC_AUTH_SECRET env var. Generate a strong random value, e.g.:
#   openssl rand -hex 32
# and set it in BOTH places — never commit the real value to git.
use-auth-secret
static-auth-secret=REPLACE_WITH_A_LONG_RANDOM_SECRET

# Cosmetic — appears in some client-side logs/diagnostics only.
realm=niakofa.com

# --- Hardening ---
# Don't relay to/from private address ranges — prevents this TURN server
# from being abused to reach internal/loopback network targets.
no-loopback-peers
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255

# Don't allow this server to also act as a STUN-only responder for random
# traffic — we already use Google's public STUN in the app; this server's
# job is TURN relay only.
no-stun

# Reasonable resource caps for a single small Circles deployment. Raise if
# you provision a bigger box and see real usage against these ceilings.
max-bps=1000000
total-quota=100
user-quota=50

# Verbose enough to debug allocation failures without flooding logs.
verbose
log-file=stdout
