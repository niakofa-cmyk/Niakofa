openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Niakofa - Map-First Community Help Platform
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User management
  - name: requests
    description: Help request operations
  - name: helpers
    description: Helper dispatch and tracking
  - name: navigation
    description: GPS routing and navigation
  - name: reports
    description: Trust and safety reporting
  - name: civic
    description: Location-aware civic and community resources
  - name: verification
    description: Identity verification and safety/panic features
  - name: businesses
    description: Business account applications and membership management

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update user profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user account (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Account deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  message:
                    type: string
        "400":
          description: Invalid id
        "500":
          description: Failed to delete account

  /users/{id}/location:
    patch:
      operationId: updateUserLocation
      tags: [users]
      summary: Update user GPS location
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationUpdate"
      responses:
        "200":
          description: Location updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}/helper-mode:
    patch:
      operationId: updateHelperMode
      tags: [users]
      summary: Toggle helper mode on/off
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HelperModeUpdate"
      responses:
        "200":
          description: Helper mode updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}/pledge:
    post:
      operationId: makePledgePayment
      tags: [users]
      summary: Make a contribution toward a Niakofa pledge
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PledgePayment"
      responses:
        "200":
          description: Pledge payment recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpRequest"

  /users/{id}/change-password:
    post:
      operationId: changePassword
      tags: [users]
      summary: Authenticated password change — requires current password as proof of possession
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Password changed — returns user and a fresh auth token
          content:
            application/json:
              schema:
                type: object
                required: [user, token]
                properties:
                  user:
                    $ref: "#/components/schemas/User"
                  token:
                    type: string
        "400":
          description: Missing fields, password too short, or new password same as current
        "401":
          description: Current password is incorrect
        "403":
          description: LEGACY_PASSWORD_REQUIRED — account has no password yet, use set-initial-password first
        "404":
          description: User not found

  /users/register:
    get:
      operationId: registerUserHint
      tags: [users]
      summary: Placeholder — informs callers to use POST instead
      responses:
        "200":
          description: Hint message
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
    post:
      operationId: registerUser
      tags: [users]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRegistration"
      responses:
        "201":
          description: Registered user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /requests:
    get:
      operationId: getRequests
      tags: [requests]
      summary: List all help requests
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, claimed, en_route, arrived, completed, pay_it_forward_pending, pending_owner_approval, cancelled]
        - name: lat
          in: query
          schema:
            type: number
        - name: lng
          in: query
          schema:
            type: number
        - name: radius_miles
          in: query
          schema:
            type: number
      responses:
        "200":
          description: List of requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HelpRequest"
    post:
      operationId: createRequest
      tags: [requests]
      summary: Create a help request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HelpRequestInput"
      responses:
        "201":
          description: Created request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpRequest"

  /requests/nearby:
    get:
      operationId: getNearbyRequests
      tags: [requests]
      summary: Get help requests near a GPS location
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
        - name: lng
          in: query
          required: true
          schema:
            type: number
        - name: radius_miles
          in: query
          schema:
            type: number
            default: 5
      responses:
        "200":
          description: Nearby requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HelpRequest"

  /requests/stats:
    get:
      operationId: getRequestStats
      tags: [requests]
      summary: Get platform-wide request statistics
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestStats"

  /requests/{id}:
    get:
      operationId: getRequest
      tags: [requests]
      summary: Get a single help request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Help request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpRequest"
    patch:
      operationId: updateRequest
      tags: [requests]
      summary: Update a help request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HelpRequestUpdate"
      responses:
        "200":
          description: Updated request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpRequest"

  /requests/{id}/claim:
    post:
      operationId: claimRequest
      tags: [requests]
      summary: Helper claims a request to fulfill
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimInput"
      responses:
        "200":
          description: Claimed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpRequest"

  /requests/{id}/en-route:
    post:
      operationId: markEnRoute
      tags: [requests]
      summary: Helper marks themselves as en route to the request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HelperIdInput"
      responses:
        "200":
          description: Updated request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpRequest"

  /requests/{id}/arrived:
    post:
      operationId: markArrived
      tags: [requests]
      summary: Helper marks arrival at the request location
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HelperIdInput"
      responses:
        "200":
          description: Updated request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpRequest"

  /requests/{id}/complete:
    post:
      operationId: completeRequest
      tags: [requests]
      summary: Mark a request as completed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteInput"
      responses:
        "200":
          description: Completed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpRequest"

  /users/{id}/transactions:
    get:
      operationId: getUserTransactions
      tags: [users]
      summary: Get transaction history for a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Transaction list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"

  /users/{id}/scheduled-payment:
    post:
      operationId: createScheduledPayment
      tags: [users]
      summary: Schedule a future repayment for a Niakofa pledge
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduledPaymentInput"
      responses:
        "201":
          description: Scheduled payment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledPayment"
    get:
      operationId: getScheduledPayments
      tags: [users]
      summary: Get scheduled payments for a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Scheduled payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduledPayment"

  /users/{id}/outstanding-pledges:
    get:
      operationId: getUserOutstandingPledges
      tags: [users]
      summary: Get user's requests with outstanding pledge balances
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Requests with outstanding pledges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HelpRequest"

  /helpers/online:
    get:
      operationId: getOnlineHelpers
      tags: [helpers]
      summary: Get all currently online helpers
      parameters:
        - name: lat
          in: query
          schema:
            type: number
        - name: lng
          in: query
          schema:
            type: number
        - name: radius_miles
          in: query
          schema:
            type: number
            default: 10
      responses:
        "200":
          description: Online helpers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HelperLocation"

  /navigation/route:
    get:
      operationId: getRoute
      tags: [navigation]
      summary: Get driving route between two coordinates
      parameters:
        - name: start_lat
          in: query
          required: true
          schema:
            type: number
        - name: start_lng
          in: query
          required: true
          schema:
            type: number
        - name: end_lat
          in: query
          required: true
          schema:
            type: number
        - name: end_lng
          in: query
          required: true
          schema:
            type: number
        - name: profile
          in: query
          required: false
          schema:
            type: string
            enum: [driving, walking, cycling]
            default: driving
          description: Routing profile
        - name: lang
          in: query
          required: false
          schema:
            type: string
          description: BCP-47 language code for navigation voice instructions (e.g. "en", "fr", "sw"). Defaults to "en".
        - name: units
          in: query
          required: false
          schema:
            type: string
            enum: [imperial, metric]
            default: imperial
          description: Distance and voice units. Pass "metric" for km-based navigation.
      responses:
        "200":
          description: Route data with turn-by-turn steps
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteData"

  /civic/resources:
    get:
      operationId: getCivicResources
      tags: [civic]
      summary: Get location-aware civic and community resources
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
        - name: lng
          in: query
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Civic resources matched to the location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CivicResourcesResponse"
        "400":
          description: Missing or invalid lat/lng

  /reports:
    post:
      operationId: createReport
      tags: [reports]
      summary: File a trust & safety report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReportInput"
      responses:
        "201":
          description: Report created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "400":
          description: Validation error
        "429":
          description: Rate limit exceeded
    get:
      operationId: getReports
      tags: [reports]
      summary: Admin — list all reports
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, under_review, resolved_dismissed, resolved_warned, resolved_banned]
      responses:
        "200":
          description: List of reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"

  /reports/{id}:
    get:
      operationId: getReport
      tags: [reports]
      summary: Admin — get a single report with enriched user info
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Report detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportDetail"
        "404":
          description: Not found

  /reports/{id}/review:
    patch:
      operationId: reviewReport
      tags: [reports]
      summary: Admin — update report status and add notes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminReviewInput"
      responses:
        "200":
          description: Updated report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "404":
          description: Not found

  /users/{id}/reports:
    get:
      operationId: getUserReports
      tags: [reports]
      summary: Get reports filed by a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reports list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"

  /users/login:
    post:
      operationId: loginUser
      tags: [users]
      summary: Authenticate with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated — returns user and auth token
          content:
            application/json:
              schema:
                type: object
                required: [user, token]
                properties:
                  user:
                    $ref: "#/components/schemas/User"
                  token:
                    type: string
        "400":
          description: Email or password missing
        "401":
          description: No account found, or incorrect password
        "403":
          description: LEGACY_PASSWORD_REQUIRED — account predates password auth, use set-initial-password

  /users/request-password-reset:
    post:
      operationId: requestPasswordReset
      tags: [users]
      summary: Email a 6-digit sign-in code (legacy-account setup and forgot-password flow)
      description: Always returns 200 regardless of whether the email exists, to avoid leaking which emails are registered.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestPasswordResetInput"
      responses:
        "200":
          description: Code sent if the account exists (response does not reveal which)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "400":
          description: Email missing

  /users/set-initial-password:
    post:
      operationId: setInitialPassword
      tags: [users]
      summary: Verify the emailed code and set a password (legacy-account / reset completion)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetInitialPasswordInput"
      responses:
        "200":
          description: Password set — returns user and a fresh auth token
          content:
            application/json:
              schema:
                type: object
                required: [user, token]
                properties:
                  user:
                    $ref: "#/components/schemas/User"
                  token:
                    type: string
        "400":
          description: Missing fields, password too short, incorrect code, or code expired
        "404":
          description: Account not found

  /users/{id}/scheduled-payment/{paymentId}:
    delete:
      operationId: deleteScheduledPayment
      tags: [users]
      summary: Cancel a scheduled payment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: paymentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Scheduled payment cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  deleted_id:
                    type: integer
        "400":
          description: Invalid id
        "404":
          description: Scheduled payment not found or does not belong to this user

  /users/{id}/avatar:
    post:
      operationId: updateUserAvatar
      tags: [users]
      summary: Update profile photo (base64 data URL)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserAvatarInput"
      responses:
        "200":
          description: Avatar updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid or missing image data
        "404":
          description: User not found
        "413":
          description: Image too large — max 5 MB

  /users/{id}/settings:
    get:
      operationId: getUserSettings
      tags: [users]
      summary: Get notification and privacy preferences (creates defaults on first visit)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Existing settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettings"
        "201":
          description: Default settings created on first visit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettings"
    put:
      operationId: updateUserSettings
      tags: [users]
      summary: Persist notification and privacy preferences
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSettingsUpdate"
      responses:
        "200":
          description: Settings upserted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettings"

  /verification/panic-contacts/{userId}:
    patch:
      operationId: updatePanicContacts
      tags: [verification]
      summary: Update emergency/panic contacts (max 5) — the route the frontend actually calls
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePanicContactsInput"
      responses:
        "200":
          description: Panic contacts updated — returns the actually-persisted (post-truncation) list
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  contacts:
                    type: array
                    items:
                      type: string
        "400":
          description: contacts must be an array
        "404":
          description: User not found

  /users/{id}/availability:
    get:
      operationId: getHelperAvailability
      tags: [users]
      summary: Get a helper's recurring weekly availability windows
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Availability windows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AvailabilityWindow"
    put:
      operationId: updateHelperAvailability
      tags: [users]
      summary: Replace a helper's recurring weekly availability windows
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateHelperAvailabilityInput"
      responses:
        "200":
          description: Availability replaced
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  count:
                    type: integer
        "400":
          description: windows must be a valid array (day_of_week 0-6, start_min/end_min in range, start < end)

  /users/{id}/logout:
    post:
      operationId: logoutUser
      tags: [users]
      summary: Client-side sign-out signal — does NOT revoke previously issued tokens (auth is stateless HMAC by design; see server code comments)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (admin only)
      responses:
        "200":
          description: User list (abbreviated fields)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSummary"

  /users/{id}/moderation:
    patch:
      operationId: moderateUser
      tags: [users]
      summary: Warn, suspend, or ban a user (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModerateUserInput"
      responses:
        "200":
          description: Moderation action applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  action:
                    type: string
                  user_id:
                    type: integer
        "400":
          description: Invalid action

  /users/{id}/helper-application:
    patch:
      operationId: updateHelperApplication
      tags: [users]
      summary: Submit a helper application, or (admin) review one
      description: |
        Two modes depending on caller: a user submitting their own application
        (helper_skills, helper_bio, etc.) is enforced via ownership; an admin
        reviewing an application sends status: approved|denied|rejected
        ("rejected" is normalized to "denied").
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HelperApplicationUpdate"
      responses:
        "200":
          description: Application submitted or reviewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid user id or request body

  /pool/stats:
    get:
      operationId: getPoolStats
      tags: [pool]
      summary: Get Community Pool balance and transparency stats
      responses:
        "200":
          description: Pool stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoolStats"

  /pool/ledger:
    get:
      operationId: getPoolLedger
      tags: [pool]
      summary: Get recent Community Pool ledger activity (public transparency feed)
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: Recent ledger entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoolLedgerResponse"

  /pool/contribute:
    post:
      operationId: contributeToPool
      tags: [pool]
      summary: Contribute funds to the Community Pool
      description: |
        With Stripe configured, returns a client_secret for a PaymentIntent
        (the webhook records the ledger entry on success). Without Stripe
        (development), the contribution is recorded directly.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PoolContributeBody"
      responses:
        "200":
          description: Contribution initiated or recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoolContributeResponse"
        "400":
          description: Invalid amount

  /businesses:
    post:
      operationId: createBusiness
      tags: [businesses]
      summary: Create a business application (starts pending admin approval)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessInput"
      responses:
        "201":
          description: Business created (pending approval)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"

  /businesses/mine:
    get:
      operationId: getMyBusinesses
      tags: [businesses]
      summary: List businesses the authenticated user belongs to
      responses:
        "200":
          description: List of businesses with member role
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Business"

  /businesses/{id}:
    get:
      operationId: getBusiness
      tags: [businesses]
      summary: Get a business (members only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Business details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
        "403":
          description: Not a member
        "404":
          description: Not found
    patch:
      operationId: updateBusiness
      tags: [businesses]
      summary: Update business details (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessInput"
      responses:
        "200":
          description: Updated business
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"

  /businesses/{id}/members:
    get:
      operationId: getBusinessMembers
      tags: [businesses]
      summary: List all members of a business (members only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BusinessMember"
    post:
      operationId: inviteBusinessMember
      tags: [businesses]
      summary: Invite a user by email (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessMemberInviteInput"
      responses:
        "201":
          description: Member invited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessMember"

  /businesses/{id}/members/{memberId}:
    delete:
      operationId: removeBusinessMember
      tags: [businesses]
      summary: Remove a member (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Member removed

  /businesses/{id}/requests:
    get:
      operationId: getBusinessRequests
      tags: [businesses]
      summary: List all requests posted under a business (members only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of business requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BusinessRequest"

  /businesses/{id}/members/{memberId}/cap:
    patch:
      operationId: setBusinessMemberCap
      tags: [businesses]
      summary: Set a staff member's spending cap (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessMemberCapInput"
      responses:
        "200":
          description: Updated member with cap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessMember"

  /businesses/{id}/pending-requests:
    get:
      operationId: getBusinessPendingRequests
      tags: [businesses]
      summary: List staff requests pending owner approval (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of pending requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BusinessPendingRequest"

  /businesses/{id}/requests/{requestId}/approve:
    patch:
      operationId: approveBusinessRequest
      tags: [businesses]
      summary: Approve or reject a pending business request (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: requestId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessRequestApproveAction"
      responses:
        "200":
          description: Request approved or rejected

components:
  schemas:
    PoolStats:
      type: object
      required: [enabled, guaranteed_minimum, balance, total_contributed, total_fronted, total_repaid, total_minimums, helpers_fronted, sponsor_count, pending_minimums_count, pending_minimums_total]
      properties:
        enabled:
          type: boolean
        guaranteed_minimum:
          type: number
        balance:
          type: number
        total_contributed:
          type: number
        total_fronted:
          type: number
        total_repaid:
          type: number
        total_minimums:
          type: number
        helpers_fronted:
          type: integer
        sponsor_count:
          type: integer
        pending_minimums_count:
          type: integer
          description: Guaranteed minimums queued because the pool ran dry
        pending_minimums_total:
          type: number
          description: Total dollars owed to helpers awaiting pool backfill

    PoolLedgerEntry:
      type: object
      required: [id, entry_type, amount, created_at]
      properties:
        id:
          type: integer
        entry_type:
          type: string
          enum: [sponsor_contribution, helper_front, pledge_repayment, guaranteed_minimum, adjustment]
        amount:
          type: number
        request_id:
          type: integer
          nullable: true
        display_name:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    PoolLedgerResponse:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/PoolLedgerEntry"

    PoolContributeBody:
      type: object
      required: [amount]
      properties:
        amount:
          type: number
          minimum: 1
          maximum: 10000

    PoolContributeResponse:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [stripe, recorded]
        client_secret:
          type: string
          nullable: true
        payment_intent_id:
          type: string
          nullable: true
        balance:
          type: number
          nullable: true

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    User:
      type: object
      required: [id, name, email, is_helper, helper_mode_active, help_count, benevolence_wallet, goodwill_score]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        avatar_url:
          type: ["string", "null"]
        is_helper:
          type: boolean
        helper_mode_active:
          type: boolean
        lat:
          type: ["number", "null"]
        lng:
          type: ["number", "null"]
        trust_score:
          type: ["number", "null"]
        help_count:
          type: integer
        neighborhood:
          type: ["string", "null"]
        benevolence_wallet:
          type: number
          description: Accumulated helper earnings and contributions
        goodwill_score:
          type: integer
          description: Community reputation score
        is_admin:
          type: boolean
          description: RBAC admin flag — see requireAdmin() middleware
        created_at:
          type: string
        account_type:
          type: ["string", "null"]
          enum: [individual, organization, business, sponsor, null]
        city:
          type: ["string", "null"]
        specialties:
          type: ["array", "null"]
          items:
            type: string

    UserUpdate:
      type: object
      properties:
        name:
          type: string
        avatar_url:
          type: string
        neighborhood:
          type: string
        is_helper:
          type: boolean
        city:
          type: string
        specialties:
          type: array
          items:
            type: string
        phone_masked:
          type: string
        quick_replies:
          type: array
          items:
            type: string

    ChangePasswordInput:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          description: The user's current password
        new_password:
          type: string
          minLength: 8
          description: The new password (min 8 chars, must differ from current)

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    RequestPasswordResetInput:
      type: object
      required: [email]
      properties:
        email:
          type: string

    SetInitialPasswordInput:
      type: object
      required: [user_id, email, code, new_password]
      properties:
        user_id:
          type: integer
        email:
          type: string
        code:
          type: string
        new_password:
          type: string
          minLength: 8

    UpdateUserAvatarInput:
      type: object
      required: [dataUrl]
      properties:
        dataUrl:
          type: string
          description: Base64-encoded image, must start with "data:image/". Max ~5 MB.

    UpdatePanicContactsInput:
      type: object
      required: [contacts]
      properties:
        contacts:
          type: array
          items:
            type: string
          maxItems: 5

    UpdateHelperAvailabilityInput:
      type: object
      required: [windows]
      properties:
        windows:
          type: array
          items:
            $ref: "#/components/schemas/AvailabilityWindowInput"

    ModerateUserInput:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [warn, ban, suspend]
        reason:
          type: string
          description: Optional reason, used for suspend

    UserSummary:
      type: object
      description: Abbreviated user fields returned by the admin user list endpoint
      required: [id, name, email, is_helper, trust_score, help_count, is_suspended, created_at]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        is_helper:
          type: boolean
        trust_score:
          type: integer
        help_count:
          type: integer
        is_suspended:
          type: boolean
        suspended_at:
          type: ["string", "null"]
          format: date-time
        suspended_reason:
          type: ["string", "null"]
        created_at:
          type: string
          format: date-time

    UserSettings:
      type: object
      required:
        - id
        - user_id
        - notif_nearby_requests
        - notif_emergency
        - notif_task_accepted
        - notif_wallet_updates
        - notif_community_activity
        - notif_pledge_reminders
        - privacy_profile_visible
        - privacy_live_location
        - privacy_activity_sharing
        - privacy_anonymous_giving
        - service_radius_miles
        - preferred_language
        - updated_at
      properties:
        id:
          type: integer
        user_id:
          type: integer
        notif_nearby_requests:
          type: boolean
        notif_emergency:
          type: boolean
        notif_task_accepted:
          type: boolean
        notif_wallet_updates:
          type: boolean
        notif_community_activity:
          type: boolean
        notif_pledge_reminders:
          type: boolean
        privacy_profile_visible:
          type: boolean
        privacy_live_location:
          type: boolean
        privacy_activity_sharing:
          type: boolean
        privacy_anonymous_giving:
          type: boolean
        service_radius_miles:
          type: number
        max_travel_miles:
          type: ["number", "null"]
        specialties:
          type: ["string", "null"]
        preferred_language:
          type: string
          enum: [en, sw, zu, tw, yo, ha, am, so, pcm, lg]
        updated_at:
          type: string
          format: date-time

    UserSettingsUpdate:
      type: object
      description: All fields optional — only provided keys are persisted (upsert)
      properties:
        notif_nearby_requests:
          type: boolean
        notif_emergency:
          type: boolean
        notif_task_accepted:
          type: boolean
        notif_wallet_updates:
          type: boolean
        notif_community_activity:
          type: boolean
        notif_pledge_reminders:
          type: boolean
        privacy_profile_visible:
          type: boolean
        privacy_live_location:
          type: boolean
        privacy_activity_sharing:
          type: boolean
        privacy_anonymous_giving:
          type: boolean
        service_radius_miles:
          type: number
        max_travel_miles:
          type: number
        specialties:
          type: string
        preferred_language:
          type: string
          enum: [en, sw, zu, tw, yo, ha, am, so, pcm, lg]

    AvailabilityWindow:
      type: object
      required: [id, user_id, day_of_week, start_min, end_min]
      properties:
        id:
          type: integer
        user_id:
          type: integer
        day_of_week:
          type: integer
          minimum: 0
          maximum: 6
          description: 0 = Sunday … 6 = Saturday
        start_min:
          type: integer
          minimum: 0
          maximum: 1439
          description: Minutes from midnight
        end_min:
          type: integer
          minimum: 1
          maximum: 1440
          description: Minutes from midnight

    AvailabilityWindowInput:
      type: object
      required: [day_of_week, start_min, end_min]
      properties:
        day_of_week:
          type: integer
          minimum: 0
          maximum: 6
        start_min:
          type: integer
          minimum: 0
          maximum: 1439
        end_min:
          type: integer
          minimum: 1
          maximum: 1440

    HelperApplicationUpdate:
      type: object
      description: |
        User mode (no status field): submit helper_skills, helper_languages,
        helper_qualifications, helper_bio, helper_vehicle, helper_social_links.
        Admin mode: send status to approve/deny an application.
      properties:
        status:
          type: string
          enum: [pending, approved, denied, rejected]
          description: Admin-only. "rejected" is normalized to "denied".
        helper_skills:
          type: array
          items:
            type: string
        helper_languages:
          type: array
          items:
            type: string
        helper_qualifications:
          type: array
          items:
            type: string
        helper_bio:
          type: string
        helper_vehicle:
          type: string
        helper_social_links:
          type: array
          items:
            type: string

    UserRegistration:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
        email:
          type: string
        avatar_url:
          type: string
        is_helper:
          type: boolean
        neighborhood:
          type: string

    LocationUpdate:
      type: object
      required: [lat, lng]
      properties:
        lat:
          type: number
        lng:
          type: number
        heading:
          type: ["number", "null"]
        speed:
          type: ["number", "null"]

    HelperModeUpdate:
      type: object
      required: [active]
      properties:
        active:
          type: boolean

    PledgePayment:
      type: object
      required: [request_id, amount]
      properties:
        request_id:
          type: integer
        amount:
          type: number
          minimum: 0.01
          description: Contribution amount in USD, must be greater than 0

    HelpRequest:
      type: object
      required: [id, title, category, status, payment_type, requester_id, lat, lng, created_at, pledge_paid]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        category:
          type: string
          enum: [groceries, transportation, errands, home_repair, medical, emergency, other, stock_shelves, event_setup, delivery_run, tech_support, local_farm, food_pantry, moving_labor, pet_care, childcare, senior_care, yard_work, tutoring, cleaning, meal_prep, paperwork, business_services]
        urgency:
          type: string
          enum: [low, medium, high, emergency]
        status:
          type: string
          enum: [open, claimed, en_route, arrived, completed, pay_it_forward_pending, pending_owner_approval, cancelled]
        payment_type:
          type: string
          enum: [immediate, pay_it_forward, goodwill]
          description: immediate=pay now, pay_it_forward=pay when able, goodwill=volunteer
        requester_id:
          type: integer
        requester_name:
          type: ["string", "null"]
        requester_avatar:
          type: ["string", "null"]
        helper_id:
          type: ["integer", "null"]
        helper_name:
          type: ["string", "null"]
        lat:
          type: number
        lng:
          type: number
        neighborhood:
          type: ["string", "null"]
        distance_miles:
          type: ["number", "null"]
        estimated_duration_min:
          type: ["integer", "null"]
        pay_it_forward_amount:
          type: ["number", "null"]
        pledge_amount:
          type: ["number", "null"]
        pledge_paid:
          type: number
          default: 0
        created_at:
          type: string
        claimed_at:
          type: ["string", "null"]
        en_route_at:
          type: ["string", "null"]
        arrived_at:
          type: ["string", "null"]
        completed_at:
          type: ["string", "null"]

    HelpRequestInput:
      type: object
      # requester_id is intentionally excluded from required — the server always
      # derives it from the auth token (req.authenticatedUserId). Clients that
      # send it will have it silently ignored; clients that omit it (the
      # standard case) work without change.
      required: [title, category, lat, lng]
      properties:
        title:
          type: string
        description:
          type: string
        category:
          type: string
          enum: [groceries, transportation, errands, home_repair, medical, emergency, other, stock_shelves, event_setup, delivery_run, tech_support, local_farm, food_pantry, moving_labor, pet_care, childcare, senior_care, yard_work, tutoring, cleaning, meal_prep, paperwork, business_services]
        urgency:
          type: string
          enum: [low, medium, high, emergency]
        payment_type:
          type: string
          enum: [immediate, pay_it_forward, goodwill]
        requester_id:
          type: integer
        lat:
          type: number
        lng:
          type: number
        neighborhood:
          type: string
        pay_it_forward_amount:
          type: number
        pledge_amount:
          type: number
        sensitive_acknowledged:
          type: boolean
          description: Required (must be true) for childcare, senior_care, and medical categories — requester acknowledges Niakofa is not a licensed childcare, homecare, or medical provider.
        business_id:
          type: integer
          nullable: true
          description: Optional. When set, the request is posted on behalf of this business. Server validates membership and blocks pay_it_forward.

    HelpRequestUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [open, claimed, en_route, arrived, completed, pay_it_forward_pending, pending_owner_approval, cancelled]
        description:
          type: string
        urgency:
          type: string
          enum: [low, medium, high, emergency]

    ClaimInput:
      type: object
      required: [helper_id]
      properties:
        helper_id:
          type: integer

    HelperIdInput:
      type: object
      required: [helper_id]
      properties:
        helper_id:
          type: integer

    CompleteInput:
      type: object
      required: [helper_id]
      properties:
        helper_id:
          type: integer
        notes:
          type: string

    RequestStats:
      type: object
      required: [total_open, total_completed, total_helpers_online, requests_by_category]
      properties:
        total_open:
          type: integer
        total_completed:
          type: integer
        total_helpers_online:
          type: integer
        requests_by_category:
          type: array
          items:
            $ref: "#/components/schemas/CategoryCount"
        recent_completions:
          type: integer
        total_pledge_volume:
          type: number
          description: Total dollars pledged/paid forward across all requests

    ScheduledPaymentInput:
      type: object
      required: [request_id, amount, scheduled_date]
      properties:
        request_id:
          type: integer
        amount:
          type: number
          description: Amount to pay on the scheduled date
        scheduled_date:
          type: string
          description: ISO date string for when to process the payment
        note:
          type: string

    ScheduledPayment:
      type: object
      required: [id, user_id, request_id, amount, scheduled_date, status, created_at]
      properties:
        id:
          type: integer
        user_id:
          type: integer
        request_id:
          type: integer
        amount:
          type: number
        scheduled_date:
          type: string
        status:
          type: string
          enum: [pending, paid, cancelled]
        note:
          type: ["string", "null"]
        created_at:
          type: string

    CategoryCount:
      type: object
      required: [category, count]
      properties:
        category:
          type: string
        count:
          type: integer

    HelperLocation:
      type: object
      required: [id, name, lat, lng, is_online]
      properties:
        id:
          type: integer
        name:
          type: string
        avatar_url:
          type: ["string", "null"]
        lat:
          type: number
        lng:
          type: number
        heading:
          type: ["number", "null"]
        trust_score:
          type: ["number", "null"]
        help_count:
          type: integer
        is_online:
          type: boolean
        active_request_id:
          type: ["integer", "null"]
        distance_miles:
          type: ["number", "null"]

    RouteData:
      type: object
      required: [geometry, distance_meters, duration_seconds, steps]
      properties:
        geometry:
          type: object
          description: GeoJSON LineString geometry
        distance_meters:
          type: number
        duration_seconds:
          type: number
        steps:
          type: array
          items:
            $ref: "#/components/schemas/RouteStep"
        eta_text:
          type: string
          description: Human-readable ETA, e.g. "12 min (moderate traffic)"
        distance_text:
          type: string
        initial_bearing:
          type: number
          description: Compass bearing (0-359) from start toward first waypoint
        speed_mph:
          type: number
        speed_kph:
          type: number
        waypoints:
          type: integer
        legs_count:
          type: integer
        bbox:
          type: array
          nullable: true
          items:
            type: number
          description: "[minLng, minLat, maxLng, maxLat] bounding box for camera fit"
        profile:
          type: string
          enum: [driving, walking, cycling]
        units:
          type: string
          enum: [imperial, metric]
        traffic_level:
          type: string
          enum: [low, moderate, heavy, severe, unknown]
          description: Dominant congestion level across the route (driving only)
        congestion_segments:
          type: integer
          description: Total number of annotated congestion segments

    Transaction:
      type: object
      required: [id, user_id, type, amount, created_at]
      properties:
        id:
          type: integer
        user_id:
          type: integer
        request_id:
          type: ["integer", "null"]
        type:
          type: string
          enum: [earned, pledge_received, pledge_sent, goodwill]
          description: earned=immediate pay, pledge_received=niakofa payment received, pledge_sent=contribution made, goodwill=volunteer act
        amount:
          type: number
        description:
          type: ["string", "null"]
        created_at:
          type: string

    RouteStep:
      type: object
      required: [instruction, distance_meters, duration_seconds]
      properties:
        instruction:
          type: string
          description: Mapbox maneuver instruction text
        voice_announcement:
          type: string
          description: Closest-range voice announcement — richer phrasing than instruction, used for TTS
        distance_meters:
          type: number
        duration_seconds:
          type: number
        maneuver_type:
          type: ["string", "null"]
        maneuver_direction:
          type: ["string", "null"]


