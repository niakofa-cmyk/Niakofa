openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Niakofa - Map-First Community Help Platform
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User management
  - name: requests
    description: Help request operations
  - name: helpers
    description: Helper dispatch and tracking
  - name: navigation
    description: GPS routing and navigation
  - name: reports
    description: Trust and safety reporting
  - name: civic
    description: Location-aware civic and community resources
  - name: nia
    description: Nia AI chat, memory, and crisis support

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update user profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}/location:
    patch:
      operationId: updateUserLocation
      tags: [users]
      summary: Update user GPS location
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationUpdate"
      responses:
        "200":
          description: Location updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}/helper-mode:
    patch:
      operationId: updateHelperMode
      tags: [users]
      summary: Toggle helper mode on/off
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HelperModeUpdate"
      responses:
        "200":
          description: Helper mode updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}/pledge:
    post:
      operationId: makePledgePayment
      tags: [users]
      summary: Make a contribution toward a Niakofa pledge
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PledgePayment"
      responses:
        "200":
          description: Pledge payment recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpRequest"

  /users/register:
    post:
      operationId: registerUser
      tags: [users]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRegistration"
      responses:
        "201":
          description: Registered user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /requests:
    get:
      operationId: getRequests
      tags: [requests]
      summary: List all help requests
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, claimed, en_route, arrived, completed, pay_it_forward_pending, cancelled]
        - name: lat
          in: query
          schema:
            type: number
        - name: lng
          in: query
          schema:
            type: number
        - name: radius_miles
          in: query
          schema:
            type: number
      responses:
        "200":
          description: List of requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HelpRequest"
    post:
      operationId: createRequest
      tags: [requests]
      summary: Create a help request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HelpRequestInput"
      responses:
        "201":
          description: Created request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpRequest"

  /requests/nearby:
    get:
      operationId: getNearbyRequests
      tags: [requests]
      summary: Get help requests near a GPS location
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
        - name: lng
          in: query
          required: true
          schema:
            type: number
        - name: radius_miles
          in: query
          schema:
            type: number
            default: 5
      responses:
        "200":
          description: Nearby requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HelpRequest"

  /requests/stats:
    get:
      operationId: getRequestStats
      tags: [requests]
      summary: Get platform-wide request statistics
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestStats"

  /requests/{id}:
    get:
      operationId: getRequest
      tags: [requests]
      summary: Get a single help request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Help request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpRequest"
    patch:
      operationId: updateRequest
      tags: [requests]
      summary: Update a help request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HelpRequestUpdate"
      responses:
        "200":
          description: Updated request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpRequest"

  /requests/{id}/claim:
    post:
      operationId: claimRequest
      tags: [requests]
      summary: Helper claims a request to fulfill
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimInput"
      responses:
        "200":
          description: Claimed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpRequest"

  /requests/{id}/en-route:
    post:
      operationId: markEnRoute
      tags: [requests]
      summary: Helper marks themselves as en route to the request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HelperIdInput"
      responses:
        "200":
          description: Updated request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpRequest"

  /requests/{id}/arrived:
    post:
      operationId: markArrived
      tags: [requests]
      summary: Helper marks arrival at the request location
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HelperIdInput"
      responses:
        "200":
          description: Updated request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpRequest"

  /requests/{id}/complete:
    post:
      operationId: completeRequest
      tags: [requests]
      summary: Mark a request as completed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteInput"
      responses:
        "200":
          description: Completed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpRequest"

  /users/{id}/transactions:
    get:
      operationId: getUserTransactions
      tags: [users]
      summary: Get transaction history for a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Transaction list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"

  /users/{id}/scheduled-payment:
    post:
      operationId: createScheduledPayment
      tags: [users]
      summary: Schedule a future repayment for a Niakofa pledge
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduledPaymentInput"
      responses:
        "201":
          description: Scheduled payment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledPayment"
    get:
      operationId: getScheduledPayments
      tags: [users]
      summary: Get scheduled payments for a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Scheduled payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduledPayment"

  /users/{id}/outstanding-pledges:
    get:
      operationId: getUserOutstandingPledges
      tags: [users]
      summary: Get user's requests with outstanding pledge balances
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Requests with outstanding pledges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HelpRequest"

  /helpers/online:
    get:
      operationId: getOnlineHelpers
      tags: [helpers]
      summary: Get all currently online helpers
      parameters:
        - name: lat
          in: query
          schema:
            type: number
        - name: lng
          in: query
          schema:
            type: number
        - name: radius_miles
          in: query
          schema:
            type: number
            default: 10
      responses:
        "200":
          description: Online helpers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HelperLocation"

  /navigation/route:
    get:
      operationId: getRoute
      tags: [navigation]
      summary: Get route between two coordinates
      parameters:
        - name: start_lat
          in: query
          required: true
          schema:
            type: number
        - name: start_lng
          in: query
          required: true
          schema:
            type: number
        - name: end_lat
          in: query
          required: true
          schema:
            type: number
        - name: end_lng
          in: query
          required: true
          schema:
            type: number
        - name: profile
          in: query
          required: false
          schema:
            type: string
            enum: [driving, walking, cycling]
            default: driving
      responses:
        "200":
          description: Route data with turn-by-turn steps
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteData"

  /civic/resources:
    get:
      operationId: getCivicResources
      tags: [civic]
      summary: Get location-aware civic and community resources
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
        - name: lng
          in: query
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Civic resources matched to the location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CivicResourcesResponse"
        "400":
          description: Missing or invalid lat/lng

  /reports:
    post:
      operationId: createReport
      tags: [reports]
      summary: File a trust & safety report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReportInput"
      responses:
        "201":
          description: Report created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "400":
          description: Validation error
        "429":
          description: Rate limit exceeded
    get:
      operationId: getReports
      tags: [reports]
      summary: Admin — list all reports
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, under_review, resolved_dismissed, resolved_warned, resolved_banned]
      responses:
        "200":
          description: List of reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"

  /reports/{id}:
    get:
      operationId: getReport
      tags: [reports]
      summary: Admin — get a single report with enriched user info
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Report detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportDetail"
        "404":
          description: Not found

  /reports/{id}/review:
    patch:
      operationId: reviewReport
      tags: [reports]
      summary: Admin — update report status and add notes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminReviewInput"
      responses:
        "200":
          description: Updated report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "404":
          description: Not found

  /users/{id}/reports:
    get:
      operationId: getUserReports
      tags: [reports]
      summary: Get reports filed by a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reports list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"

  /requests/{id}/cancel:
    post:
      operationId: cancelRequest
      tags: [requests]
      summary: Cancel a request — helper unclaims (re-opens to pool) or requester withdraws (marks cancelled)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpRequest"
        "403":
          description: Not authorized to cancel this request
        "404":
          description: Request not found
        "409":
          description: Request is already completed or cancelled

  /requests/{id}/rate:
    post:
      operationId: rateRequest
      tags: [requests]
      summary: Rate the other participant after a completed request (1–5 stars + optional review)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RateInput"
      responses:
        "201":
          description: Rating created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rating"
        "403":
          description: Only participants can rate
        "404":
          description: Request not found
        "409":
          description: Already rated or request not completed

  /users/set-initial-password:
    post:
      operationId: setInitialPassword
      tags: [users]
      summary: One-time password setup for legacy accounts that pre-date passwords (unauthenticated, rate-limited)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetInitialPasswordInput"
      responses:
        "200":
          description: Password set — returns full auth token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Missing fields or password too short
        "403":
          description: Email does not match account
        "404":
          description: User not found
        "409":
          description: Account already has a password — use normal login

  # Nia paths appended below
  # ── Nia AI routes ────────────────────────────────────────────────────────────
  /nia/chat:
    post:
      operationId: niaChat
      tags: [nia]
      summary: Chat with Nia AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NiaChatRequest"
      responses:
        "200":
          description: SSE stream of Nia's response
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/NiaChatResponseSchema"
        "400":
          description: Invalid request
        "429":
          description: Rate limited
        "503":
          description: Nia is temporarily unavailable

  /nia/history/{sessionId}:
    get:
      operationId: niaHistory
      tags: [nia]
      summary: Get conversation history for a session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Conversation history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NiaHistoryResponseSchema"
        "403":
          description: Unauthorized to access this history
        "503":
          description: Nia is temporarily unavailable

  /nia/memory:
    get:
      operationId: niaGetMemory
      tags: [nia]
      summary: Get user's Nia memory
      responses:
        "200":
          description: User memory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NiaMemoryResponse"
        "401":
          description: Authentication required
    delete:
      operationId: niaClearMemory
      tags: [nia]
      summary: Clear user's Nia memory
      responses:
        "200":
          description: Memory cleared
        "401":
          description: Authentication required

  /nia/share-story:
    post:
      operationId: niaShareStory
      tags: [nia]
      summary: Share a story with Nia for crafting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NiaShareStoryRequest"
      responses:
        "200":
          description: Crafted story
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NiaShareStoryResponseSchema"
        "400":
          description: Invalid transcript
        "503":
          description: Nia is temporarily unavailable

  /admin/nia-status:
    get:
      operationId: niaStatus
      tags: [nia]
      summary: Check if Nia AI is enabled
      responses:
        "200":
          description: Nia status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NiaStatusResponseSchema"

  /admin/nia-toggle:
    post:
      operationId: niaToggle
      tags: [nia]
      summary: Toggle Nia AI on/off (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NiaToggleRequest"
      responses:
        "200":
          description: Toggle successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NiaToggleResponseSchema"
        "400":
          description: Invalid request
        "403":
          description: Admin access required



components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    User:
      type: object
      required: [id, name, email, is_helper, helper_mode_active, help_count, benevolence_wallet, goodwill_score]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        avatar_url:
          type: ["string", "null"]
        is_helper:
          type: boolean
        helper_mode_active:
          type: boolean
        lat:
          type: ["number", "null"]
        lng:
          type: ["number", "null"]
        trust_score:
          type: ["number", "null"]
        help_count:
          type: integer
        neighborhood:
          type: ["string", "null"]
        benevolence_wallet:
          type: number
          description: Accumulated helper earnings and contributions
        goodwill_score:
          type: integer
          description: Community reputation score
        created_at:
          type: string
        city:
          type: ["string", "null"]
        specialties:
          type: array
          items:
            type: string
          nullable: true
        phone_masked:
          type: ["string", "null"]
        quick_replies:
          type: array
          items:
            type: string
          nullable: true
        account_type:
          type: string
          default: individual
        organization_name:
          type: ["string", "null"]
        organization_description:
          type: ["string", "null"]
        helper_status:
          type: ["string", "null"]
        helper_languages:
          type: array
          items:
            type: string
          nullable: true
        helper_qualifications:
          type: array
          items:
            type: string
          nullable: true
        helper_bio:
          type: ["string", "null"]
        helper_vehicle:
          type: ["string", "null"]
        helper_social_links:
          type: array
          items:
            type: string
          nullable: true
        token_version:
          type: integer
        approval_status:
          type: ["string", "null"]
        is_suspended:
          type: boolean
        helper_skills:
          type: array
          items:
            type: string
          nullable: true

    UserUpdate:
      type: object
      properties:
        name:
          type: string
        avatar_url:
          type: string
        neighborhood:
          type: string
        is_helper:
          type: boolean
        city:
          type: string
        specialties:
          type: array
          items:
            type: string
        phone_masked:
          type: string
        quick_replies:
          type: array
          items:
            type: string
        account_type:
          type: string
          enum: [individual, organization]
        organization_name:
          type: string
        organization_description:
          type: string
        helper_status:
          type: string
        helper_languages:
          type: array
          items:
            type: string
        helper_qualifications:
          type: array
          items:
            type: string
        helper_bio:
          type: string
        helper_vehicle:
          type: string
        helper_social_links:
          type: array
          items:
            type: string

    UserRegistration:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
        email:
          type: string
        avatar_url:
          type: string
        is_helper:
          type: boolean
        neighborhood:
          type: string

    LocationUpdate:
      type: object
      required: [lat, lng]
      properties:
        lat:
          type: number
        lng:
          type: number
        heading:
          type: ["number", "null"]
        speed:
          type: ["number", "null"]

    HelperModeUpdate:
      type: object
      required: [active]
      properties:
        active:
          type: boolean

    PledgePayment:
      type: object
      required: [request_id, amount]
      properties:
        request_id:
          type: integer
        amount:
          type: number
          description: Contribution amount (any amount accepted)

    HelpRequest:
      type: object
      required: [id, title, category, status, payment_type, requester_id, lat, lng, created_at, pledge_paid]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        category:
          type: string
          enum: [groceries, transportation, errands, home_repair, medical, emergency, other, stock_shelves, event_setup, delivery_run, tech_support]
        urgency:
          type: string
          enum: [low, medium, high, emergency]
        status:
          type: string
          enum: [open, claimed, en_route, arrived, completed, pay_it_forward_pending, cancelled]
        outside_usual_area:
          type: ["boolean", "null"]
        voice_activated:
          type: boolean
